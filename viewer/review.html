<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICT Model Review</title>
<style>
pre.research { white-space: pre-wrap; font-size: 12px; overflow-x: auto; padding: 12px; border-radius: 8px; background: var(--surface, rgba(127,127,127,.08)); }
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --text: #1b1f24; --muted: #5b6470; --line: #dde1e6;
    --bull: #1a9e6c; --bear: #d64545; --accent: #3867d6; --warn: #c98a00; --ict: #8e44ad;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #161b21; --text: #e6e9ed; --muted: #95a0ad; --line: #2a313a;
      --bull: #2ecc8f; --bear: #ff6b6b; --accent: #6c8cff; --warn: #f0b429; --ict: #c58cf0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --panel: #161b21; --text: #e6e9ed; --muted: #95a0ad; --line: #2a313a;
    --bull: #2ecc8f; --bear: #ff6b6b; --accent: #6c8cff; --warn: #f0b429; --ict: #c58cf0;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
           padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header nav { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-left: auto; align-items: center; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; font: inherit; }
  main { max-width: 1180px; margin: 0 auto; padding: 8px 16px 48px; }
  section { margin-top: 28px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
  h3 { font-size: 14px; margin: 16px 0 6px; font-weight: 650; }
  p.note { color: var(--muted); margin: 0 0 10px; max-width: 75ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .card h3 { margin-top: 0; }
  .big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kv { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); }
  .kv b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pos { color: var(--bull); } .neg { color: var(--bear); } .muted { color: var(--muted); }
  .tip { border-left: 3px solid var(--accent); }
  .tip.pos-tip { border-left-color: var(--bull); } .tip.neg-tip { border-left-color: var(--bear); }
  .tip .head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 600; }
  .wrap { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--panel); }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: 0; }
  td.best { background: color-mix(in srgb, var(--bull) 16%, transparent); font-weight: 650; }
  .bar { position: relative; display: inline-block; width: 90px; height: 10px; vertical-align: middle; background: color-mix(in srgb, var(--line) 50%, transparent); border-radius: 2px; }
  .bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .bar i.pos { left: 50%; background: var(--bull); } .bar i.neg { right: 50%; background: var(--bear); }
  .cause { margin-bottom: 10px; }
  .cause ul { list-style: none; margin: 6px 0 0; padding: 0; }
  .cause li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 2px 8px; align-items: baseline; padding: 3px 0; border-top: 1px dashed var(--line); }
  .cause li > span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cause li > span:last-child { text-align: right; min-width: 48px; font-variant-numeric: tabular-nums; }
  .grid.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
  .cause li:first-child { border-top: 0; }
  .meter { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; background: var(--bear); }
  details summary { cursor: pointer; color: var(--muted); }
  @media (max-width: 600px) {
    header nav { margin-left: 0; }
    .bar { width: 56px; }
  }
</style>
</head>
<body>
<!--__BODY__-->
<script type="application/json" id="review-data">/*__REVIEW__*/null</script>
<script>
  document.getElementById("theme").onclick = () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("review-theme", r.dataset.theme); } catch (e) {}
  };
  try { const t = localStorage.getItem("review-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</body>
</html>
