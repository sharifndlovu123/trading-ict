<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trade Handling</title>
<style>
:root {
  --bg: #f2f3f0; --panel: #fff; --ink: #1b1f1d; --muted: #646b66; --line: #d9ddd7; --accent: #2f5d50;
  --up: #1f7a55; --down: #b23b3b; --entry: #2b4f8a; --stop: #b23b3b; --tp: #1f7a55; --bs: #2b62b8; --ss: #c0562a;
  --area: #7a5ea8; --mine: #138a72; --mystop: #d0361f; --grid: #eceee9; --chip: #e8ebe5; --key: #b58a00;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --panel: #181d1a; --ink: #e5e8e4; --muted: #9aa39d; --line: #2c3330; --accent: #7fbfa9;
  --up: #4cc28c; --down: #e0706f; --entry: #7ea6e8; --stop: #e0706f; --tp: #4cc28c; --bs: #7ea6e8; --ss: #f0915f;
  --area: #b49ce0; --mine: #4fd1b5; --mystop: #ff6b52; --grid: #1e2421; --chip: #232a26; --key: #e8c04a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .t { font-weight: 600; font-size: 15px; }
select, input, textarea, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); font-weight: 600; }
button.armed { background: var(--mine); color: #fff; border-color: var(--mine); }
.pill { padding: 1px 8px; border-radius: 999px; background: var(--chip); font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: nowrap; }
.muted { color: var(--muted); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 6px; padding: 6px; height: calc(100vh - 52px); min-height: 560px; }
.chartbox { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); align-items: center; }
.tab, .chip { padding: 2px 9px; border-radius: 5px; border: 1px solid var(--line); cursor: pointer; user-select: none; font-family: ui-monospace, monospace; }
.tab.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.chip.on { background: var(--chip); border-color: var(--muted); }
.chip:not(.on) { opacity: .45; }
#chart { flex: 1; min-height: 0; }
#hint { display: none; position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 5; background: var(--mine); color: #fff; padding: 3px 10px; border-radius: 5px; font-weight: 600; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow-y: auto; padding: 8px 10px; }
h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.box div { margin: 2px 0; }
.mono { font-family: ui-monospace, monospace; }
.tools { display: flex; flex-wrap: wrap; gap: 4px; }
.lvl { display: grid; grid-template-columns: 70px 80px 1fr auto; gap: 4px; align-items: center; margin: 3px 0; }
.lvl input[type=number] { width: 70px; }
.lvl .note { grid-column: 1 / -1; }
.res { border: 2px solid var(--accent); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.res .big { font-size: 16px; font-weight: 700; font-family: ui-monospace, monospace; }
.kind-cut { color: var(--down); font-weight: 600; } .kind-won { color: var(--up); font-weight: 600; }
textarea { width: 100%; min-height: 60px; }
#status { margin-left: auto; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } .chartbox { height: 70vh; } }
</style>
</head>
<body>
<header>
  <span class="t">Trade Handling</span>
  <button id="prev" title="previous (←)">◀</button>
  <select id="pick"></select>
  <button id="next" title="next (→)">▶</button>
  <span id="meta"></span>
  <span id="status" class="muted"></span>
</header>
<div class="wrap">
  <div class="chartbox">
    <div class="tabs">
      <span class="tab" data-tf="1w">W</span><span class="tab" data-tf="1d">D</span><span class="tab" data-tf="4h">4H</span><span class="tab" data-tf="1h">1H</span><span class="tab" data-tf="15m">15m</span><span class="tab" data-tf="5m">5m</span>
      <span class="muted" style="margin-left:10px">show:</span>
      <span class="chip on" data-f="engine">engine plan</span><span class="chip" data-f="liq">liquidity map</span><span class="chip" data-f="areas">areas</span>
    </div>
    <div id="hint"></div>
    <div id="chart"></div>
  </div>
  <aside>
    <div class="box" id="facts"></div>
    <h3>Your handling — drag the engine's lines to where they belong, or click a tool then the chart</h3>
    <div class="tools">
      <button data-tool="stop">set stop</button><button data-tool="tp">+ add TP</button><button data-tool="entry">set entry</button>
      <label class="muted" style="margin-left:auto"><input type="checkbox" id="be"> stop to entry after TP1</label>
    </div>
    <div id="levels" style="margin-top:6px"></div>
    <div class="res" id="res"></div>
    <div id="verdictbox" style="display:none">
      <h3>Re-entry — was this second trade valid?</h3>
      <select id="verdict" style="width:100%">
        <option value="">— pick one —</option>
        <option value="valid">valid re-entry (as the engine took it)</option>
        <option value="valid_elsewhere">re-enter, but at a different place / time (move the entry)</option>
        <option value="no_reentry">first trade was fine, but no re-entry here</option>
        <option value="wrong_side">wrong side — I'd trade the other way</option>
        <option value="no_trade">neither trade — I'd stay out</option>
      </select>
    </div>
    <h3>Why — stop and targets from the same map, used differently</h3>
    <textarea id="notes" placeholder="Where the stop belongs and why (which liquidity protects it), where price is drawn to, when to take partials…"></textarea>
    <div style="display:flex;gap:6px;margin:8px 0 14px;align-items:center">
      <button class="primary" id="save">Save</button><span id="saved" class="muted"></span>
    </div>
  </aside>
</div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP" crossorigin="anonymous"></script>
<script src="linedrag.js"></script>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = x => x == null ? "–" : (+x).toFixed(2);
const STOP_WHY = ["beyond the sweep extreme", "beyond 5m swing", "beyond 15m swing", "beyond 1h swing", "beyond 4h swing",
  "beyond FVG / imbalance", "beyond order block", "beyond liquidity level", "beyond the range", "other"];
const TP_WHY = ["swing high/low", "equal highs/lows", "session high/low (Asia/London)", "PDH/PDL", "PWH/PWL",
  "FVG / imbalance", "range 50%", "opposite range end", "other"];
const st = { ids: [], i: 0, it: null, tf: "5m", answers: {}, tool: null, filt: { engine: true, liq: false, areas: false } };
let drafts = {};
try { drafts = JSON.parse(localStorage.getItem("handling-drafts") || "{}"); } catch (e) {}
try { Object.assign(st.filt, JSON.parse(localStorage.getItem("handling-filt") || "{}")); } catch (e) {}
const saveDrafts = () => { try { localStorage.setItem("handling-drafts", JSON.stringify(drafts)); } catch (e) {} };
const draft = () => (drafts[st.it.id] ||= { stop: null, tps: [], entry: null, be: false, notes: "", verdict: "" });

const chart = LightweightCharts.createChart($("chart"), { autoSize: true,
  layout: { background: { color: css("--panel") }, textColor: css("--muted") },
  grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
  rightPriceScale: { borderColor: css("--line") }, timeScale: { borderColor: css("--line"), timeVisible: true },
  crosshair: { mode: 0 } });
const series = chart.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"), borderVisible: false,
  wickUpColor: css("--up"), wickDownColor: css("--down") });
let lines = [];
const line = (price, color, width, style, title) => lines.push(series.createPriceLine({ price, color, lineWidth: width, lineStyle: style, axisLabelVisible: true, title }));

function drawLines() {
  lines.forEach(l => series.removePriceLine(l)); lines = [];
  const it = st.it, d = draft();
  if (st.filt.liq || st.filt.areas) for (const x of it.map.items) {
    if (x.role === "area" ? !st.filt.areas : !st.filt.liq) continue;
    const c = x.role === "buyside" ? css("--bs") : x.role === "sellside" ? css("--ss") : css("--area");
    if (x.role === "area") { lines.push(series.createPriceLine({ price: x.top, color: c, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: "" }));
      lines.push(series.createPriceLine({ price: x.bottom, color: c, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: `${x.tf} ${x.kind}` })); }
    else lines.push(series.createPriceLine({ price: x.price, color: c, lineWidth: 1, lineStyle: 0, axisLabelVisible: false, title: `${x.tf === "session" ? "" : x.tf + " "}${x.kind}` }));
  }
  if (it.prior) {                     // the stopped first trade of this window (re-entry review)
    line(it.prior.entry, css("--muted"), 1, 2, "1st entry"); line(it.prior.stop, css("--muted"), 1, 2, "1st stop");
  }
  if (st.filt.engine) {
    line(it.entry, css("--entry"), 1, 0, "engine entry"); line(it.stop, css("--stop"), 1, 0, "engine stop");
    line(it.tp1, css("--tp"), 1, 0, "engine TP1"); line(it.final, css("--tp"), 1, 2, "engine final");
  }
  if (d.entry != null) line(d.entry, css("--mine"), 2, 0, "your entry");
  if (d.stop) line(d.stop.price, css("--mystop"), 3, 1, "your stop");
  d.tps.forEach((t, i) => line(t.price, css("--mine"), 3, 1, `your TP${i + 1} ${t.pct}%`));
}

function setData() {
  const rows = st.it.panels[st.tf] || [];
  series.setData(rows.map(c => ({ time: c[0], open: c[1], high: c[2], low: c[3], close: c[4] })));
  const mk = [{ time: snap(st.it.decided), position: st.it.side === "long" ? "belowBar" : "aboveBar", color: css("--key"), shape: st.it.side === "long" ? "arrowUp" : "arrowDown", text: "decision" }];
  if (st.it.filled) mk.push({ time: snap(st.it.filled), position: "inBar", color: css("--entry"), shape: "circle", text: "fill" });
  if (st.it.exit_at) mk.push({ time: snap(st.it.exit_at), position: "inBar", color: st.it.exit === "stop" ? css("--stop") : css("--tp"), shape: "square", text: st.it.exit });
  series.setMarkers(mk.filter(m => m.time != null).sort((a, b) => a.time - b.time));
  chart.timeScale().fitContent();
  drawLines();
}
function snap(t) {   // marker time → the bar that contains it on this panel
  const rows = st.it.panels[st.tf] || []; let best = null;
  for (const c of rows) { if (c[0] <= t) best = c[0]; else break; }
  return best;
}

// replay on the 1m path (high/low per bar from the decision to 16:55); same-bar stop and target → stop first
function replay() {
  const it = st.it, d = draft(), long = it.side === "long", sgn = long ? 1 : -1;
  const entry = d.entry != null ? d.entry : it.entry, stop = d.stop ? d.stop.price : it.stop;
  const tps = d.tps.length ? d.tps.map(t => ({ ...t })) : [{ price: it.tp1, pct: 100 }];
  const risk = (entry - stop) * sgn;
  if (!(risk > 0)) return { error: "stop must be on the far side of the entry" };
  if (tps.some(t => (t.price - entry) * sgn <= 0)) return { error: "every TP must be beyond the entry" };
  tps.sort((a, b) => (a.price - b.price) * sgn);
  const total = tps.reduce((s, t) => s + (+t.pct || 0), 0) || 100;
  let filled = null, cur = stop, left = 1, r = 0, k = 0, ev = [];
  const start = d.entry != null ? it.decided : (it.filled || it.decided);
  for (const [t, h, l] of it.path) {
    if (t < start) continue;
    if (filled == null) {
      if (d.entry == null && it.filled) filled = t;
      else if (long ? l <= entry : h >= entry) filled = t;
      if (filled == null) continue;
      ev.push(`filled ${new Date(t * 1000).toISOString().slice(11, 16)}`);
    }
    if (long ? l <= cur : h >= cur) { r += left * (cur - entry) * sgn / risk; ev.push(`stopped ${new Date(t * 1000).toISOString().slice(11, 16)} at ${fmt(cur)}`); left = 0; break; }
    while (k < tps.length && (long ? h >= tps[k].price : l <= tps[k].price)) {
      const part = Math.min(left, (+tps[k].pct || 0) / total);
      r += part * (tps[k].price - entry) * sgn / risk; left -= part;
      ev.push(`TP${k + 1} ${new Date(t * 1000).toISOString().slice(11, 16)} (${Math.round(part * 100)}%)`);
      if (k === 0 && d.be) cur = entry;
      k++;
    }
    if (left <= 1e-9) break;
  }
  if (filled == null) return { r: 0, ev: ["not filled by 16:55"], risk, engine: it.runner_r };
  if (left > 1e-9) { const last = it.path[it.path.length - 1]; const px = (last[1] + last[2]) / 2;
    r += left * (px - entry) * sgn / risk; ev.push(`rest closed 16:55 ≈ ${fmt(px)}`); }
  return { r, ev, risk, rEngine: r * risk / it.risk, engine: it.runner_r };
}

function levelsBox() {
  const d = draft();
  const sel = (opts, v, k) => `<select data-k="${k}">${opts.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  let h = "";
  if (d.entry != null) h += `<div class="lvl"><b class="mono">${fmt(d.entry)}</b><span>entry</span><span></span><button data-del="entry">✕</button></div>`;
  if (d.stop) h += `<div class="lvl" data-w="stop"><b class="mono">${fmt(d.stop.price)}</b><span>stop</span>${sel(STOP_WHY, d.stop.why, "why")}<button data-del="stop">✕</button></div>`;
  d.tps.forEach((t, i) => { h += `<div class="lvl" data-w="tp" data-i="${i}"><b class="mono">${fmt(t.price)}</b><span>TP${i + 1} <input type="number" min="0" max="100" step="5" data-k="pct" value="${t.pct}">%</span>${sel(TP_WHY, t.why, "why")}<button data-del="tp${i}">✕</button></div>`; });
  $("levels").innerHTML = h || '<div class="muted">Nothing placed yet — the replay below uses the engine plan.</div>';
  $("levels").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const k = b.dataset.del; if (k === "entry") d.entry = null; else if (k === "stop") d.stop = null; else d.tps.splice(+k.slice(2), 1);
    saveDrafts(); refresh(); });
  $("levels").querySelectorAll(".lvl[data-w]").forEach(el => el.querySelectorAll("[data-k]").forEach(inp => inp.onchange = inp.oninput = () => {
    const o = el.dataset.w === "stop" ? d.stop : d.tps[+el.dataset.i]; o[inp.dataset.k] = inp.dataset.k === "pct" ? +inp.value : inp.value;
    saveDrafts(); drawLines(); resBox(); }));
}

function resBox() {
  const x = replay(), d = draft(), mine = d.stop || d.tps.length || d.entry != null;
  if (x.error) { $("res").innerHTML = `<b style="color:var(--mystop)">${x.error}</b>`; return; }
  $("res").innerHTML = `<div class="muted">${mine ? "Your handling, replayed on the 1m path:" : "Engine plan replayed (place your own levels to compare):"}</div>
    <div class="big">${x.r >= 0 ? "+" : ""}${x.r.toFixed(2)} R <span class="muted" style="font-size:12px">on your risk ${fmt(x.risk)}</span></div>
    ${x.rEngine != null && mine ? `<div>= ${x.rEngine >= 0 ? "+" : ""}${x.rEngine.toFixed(2)} × the engine's risk (${fmt(st.it.risk)})</div>` : ""}
    <div>engine result: <b class="mono">${x.engine >= 0 ? "+" : ""}${(+x.engine).toFixed(2)} R</b> (runner)</div>
    <div class="muted mono" style="font-size:11px">${x.ev.join(" → ")}</div>`;
}

function facts() {
  const it = st.it, k = it.map.key || {}, b = k.bias || {};
  const t = x => x == null ? "–" : new Date(x * 1000).toISOString().slice(11, 16);
  const head = it.kind === "reentry"
    ? `<span class="kind-${it.outcome === "won" ? "won" : "cut"}">RE-ENTRY after a stopped ${it.prior.side} — the engine's re-entry ${it.outcome === "won" ? "made money" : "lost"} (${(+it.runner_r).toFixed(2)} R)</span>
       <div class="muted">1st trade: entry ${fmt(it.prior.entry)} · stop ${fmt(it.prior.stop)} · filled ${t(it.prior.filled)} · stopped ${t(it.prior.exit_at)} (${it.prior.r} R) — grey dashed lines</div>`
    : `<span class="kind-${it.kind}">${it.kind === "cut" ? "CUT OFF — moved our way, stopped, then ran" : "WON — TP1 before the stop"}</span>`;
  $("facts").innerHTML = `<div>${head}</div>
    <div>${it.model} · <b>${it.side.toUpperCase()}</b> · ${it.window || ""} · POI ${it.poi || "–"}</div>
    <div class="mono">entry ${fmt(it.entry)} · stop ${fmt(it.stop)} (risk ${fmt(it.risk)}) · TP1 ${fmt(it.tp1)} ${it.tp1_name || ""} · final ${fmt(it.final)}</div>
    ${it.mfe_close != null ? `<div>best move our way: <b>${it.mfe_before_stop} R</b> before the stop, <b>${it.mfe_close} R</b> by the close (against: ${it.mae_close} R)</div>` : ""}
    <div class="muted">swept: ${it.liquidity || "–"} · bias ${b.prev_day_dol || "?"} / weekly ${b.dol_weekly || "?"}${k.daily_range ? ` · daily range ${Math.round(k.daily_range.fraction * 100)}% (${k.daily_range.zone})` : ""}</div>`;
}

function refresh() { levelsBox(); drawLines(); resBox(); }
function render() {
  const d = draft();
  $("meta").innerHTML = `${st.it.label} · <span class="pill">${st.it.model}</span>`;
  $("status").textContent = `${st.i + 1}/${st.ids.length} · saved ${Object.keys(st.answers).filter(k => st.ids.includes(k)).length}`;
  $("notes").value = d.notes || ""; $("be").checked = !!d.be;
  $("verdictbox").style.display = st.it.prior ? "" : "none"; $("verdict").value = d.verdict || "";
  $("saved").textContent = st.answers[st.it.id] ? "saved ✓" : "";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tf === st.tf));
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", !!st.filt[c.dataset.f]));
  facts(); setData(); refresh();
}
async function load(i) {
  st.i = (i + st.ids.length) % st.ids.length; setTool(null);
  st.it = await (await fetch(`s/${st.ids[st.i]}.json`)).json();
  $("pick").value = st.ids[st.i];
  try { localStorage.setItem("handling-at", st.ids[st.i]); } catch (e) {}
  render();
}
function setTool(t) {
  st.tool = st.tool === t ? null : t;
  document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("armed", b.dataset.tool === st.tool));
  $("hint").style.display = st.tool ? "block" : "none";
  $("hint").textContent = st.tool ? `click the chart to place your ${st.tool === "tp" ? "TP" : st.tool}` : "";
}
lineDrag(chart, series, $("chart"), {
  targets: () => {
    const it = st.it, d = draft(), out = [];
    if (d.entry != null) out.push({ key: "entry", price: d.entry });
    if (d.stop) out.push({ key: "stop", price: d.stop.price });
    d.tps.forEach((t, i) => out.push({ key: "tp" + i, price: t.price }));
    if (st.filt.engine) {          // grabbing an engine line makes your own copy of it
      if (d.entry == null) out.push({ key: "entry", price: it.entry });
      if (!d.stop) out.push({ key: "stop", price: it.stop });
      if (!d.tps.length) out.push({ key: "eng-tp1", price: it.tp1 });
      if (d.tps.length < 2 && Math.abs(it.final - it.tp1) > 1e-9) out.push({ key: "eng-final", price: it.final });
    }
    return out;
  },
  move: (key, price) => {
    const d = draft();
    if (key === "entry") d.entry = price;
    else if (key === "stop") d.stop = { price, why: d.stop ? d.stop.why : STOP_WHY[0] };
    else if (key.startsWith("tp")) d.tps[+key.slice(2)].price = price;
    else if (key === "eng-tp1" || key === "eng-final") {
      if (!d.tps.length) d.tps.push({ price: st.it.tp1, pct: 50, why: TP_WHY[0] });
      if (key === "eng-final") { d.tps.push({ price, pct: 50, why: TP_WHY[0] }); key = "tp" + (d.tps.length - 1); }
      else { d.tps[0].price = price; key = "tp0"; }
    }
    drawLines();
    return key;
  },
  done: () => { saveDrafts(); refresh(); },
});
chart.subscribeClick(p => {
  if (Date.now() - lineDrag.lastDrag < 300) return;
  if (!st.tool || !p.point) return;
  const price = series.coordinateToPrice(p.point.y); if (price == null) return;
  const v = Math.round(price * 100) / 100, d = draft();
  if (st.tool === "stop") d.stop = { price: v, why: d.stop ? d.stop.why : STOP_WHY[0] };
  else if (st.tool === "entry") d.entry = v;
  else d.tps.push({ price: v, pct: d.tps.length ? 25 : 50, why: TP_WHY[0] });
  if (st.tool !== "tp") setTool(null);
  saveDrafts(); refresh();
});
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
$("be").onchange = () => { draft().be = $("be").checked; saveDrafts(); resBox(); };
$("notes").oninput = () => { draft().notes = $("notes").value; saveDrafts(); };
$("verdict").onchange = () => { draft().verdict = $("verdict").value; saveDrafts(); };
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { st.tf = t.dataset.tf; render(); });
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { st.filt[c.dataset.f] = !st.filt[c.dataset.f];
  try { localStorage.setItem("handling-filt", JSON.stringify(st.filt)); } catch (e) {} render(); });
$("prev").onclick = () => load(st.i - 1); $("next").onclick = () => load(st.i + 1);
$("pick").onchange = () => load(st.ids.indexOf($("pick").value));
document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "ArrowLeft") load(st.i - 1); else if (e.key === "ArrowRight") load(st.i + 1);
  else if ("123456".includes(e.key)) { st.tf = ["1w", "1d", "4h", "1h", "15m", "5m"][+e.key - 1]; render(); }
  else if (e.key === "Escape") setTool(null);
  else if (e.key === "s") setTool("stop"); else if (e.key === "t") setTool("tp"); else if (e.key === "e") setTool("entry");
});
$("save").onclick = async () => {
  const d = draft(), x = replay();
  const body = { id: st.it.id, asset: st.it.asset, side: st.it.side, kind: st.it.kind, engine: { entry: st.it.entry, stop: st.it.stop, tp1: st.it.tp1, final: st.it.final, runner_r: st.it.runner_r },
                 entry: d.entry, stop: d.stop, tps: d.tps, be: d.be, notes: d.notes, verdict: d.verdict || null, replay_r: x.r ?? null, replay_events: x.ev ?? [] };
  const r = await fetch("api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { $("saved").textContent = "save failed — is the server running?"; return; }
  st.answers[st.it.id] = body; render();
};
(async () => {
  const idx = await (await fetch("index.json")).json();
  st.ids = idx.ids;
  try { st.answers = await (await fetch("api/answers")).json(); } catch (e) { st.answers = {}; }
  const label = id => { const p = id.replace(/^re-/, "").split("-"); const d = p[2], t = p[3]; return `${p[0] === "mmxm" ? "MMxM" : "2022"} ${p[1]} ${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)} ${t.slice(0, 2)}:${t.slice(2)}`; };
  $("pick").innerHTML = st.ids.map(id => `<option value="${id}">${st.answers[id] ? "✓ " : ""}${label(id)}</option>`).join("");
  let start = 0;
  try { const at = localStorage.getItem("handling-at"); if (at && st.ids.includes(at)) start = st.ids.indexOf(at); } catch (e) {}
  load(start);
})();
</script>
</body>
</html>
