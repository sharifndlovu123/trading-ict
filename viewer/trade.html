<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engine Trades</title>
<style>
:root {
  --bg: #f2f3f0; --panel: #fff; --ink: #1b1f1d; --muted: #646b66; --line: #d9ddd7; --accent: #2f5d50;
  --up: #1f7a55; --down: #b23b3b; --entry: #2b4f8a; --stop: #b23b3b; --tp: #1f7a55; --bs: #2b62b8; --ss: #c0562a;
  --area: #7a5ea8; --arr: #b58a00; --mine: #138a72; --mystop: #d0361f; --grid: #eceee9; --chip: #e8ebe5; --key: #b58a00;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --panel: #181d1a; --ink: #e5e8e4; --muted: #9aa39d; --line: #2c3330; --accent: #7fbfa9;
  --up: #4cc28c; --down: #e0706f; --entry: #7ea6e8; --stop: #e0706f; --tp: #4cc28c; --bs: #7ea6e8; --ss: #f0915f;
  --area: #b49ce0; --mine: #4fd1b5; --mystop: #ff6b52; --grid: #1e2421; --chip: #232a26; --key: #e8c04a; } }
:root[data-theme="dark"] {
  --bg: #111513; --panel: #181d1a; --ink: #e5e8e4; --muted: #9aa39d; --line: #2c3330; --accent: #7fbfa9;
  --up: #4cc28c; --down: #e0706f; --entry: #7ea6e8; --stop: #e0706f; --tp: #4cc28c; --bs: #7ea6e8; --ss: #f0915f;
  --area: #b49ce0; --mine: #4fd1b5; --mystop: #ff6b52; --grid: #1e2421; --chip: #232a26; --key: #e8c04a; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
header .t { font-weight: 600; font-size: 15px; }
select, input, textarea, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); font-weight: 600; }
button.armed { background: var(--mine); color: #fff; border-color: var(--mine); }
.pill { padding: 1px 8px; border-radius: 999px; background: var(--chip); font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: nowrap; }
.muted { color: var(--muted); }
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 6px; padding: 6px; height: calc(100vh - 52px); min-height: 560px; }
.chartbox { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); align-items: center; }
.tab, .chip { padding: 2px 9px; border-radius: 5px; border: 1px solid var(--line); cursor: pointer; user-select: none; font-family: ui-monospace, monospace; }
.tab.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.chip.on { background: var(--chip); border-color: var(--muted); }
.chip:not(.on) { opacity: .45; }
#chart { flex: 1; min-height: 0; }
#hint { display: none; position: absolute; top: 46px; left: 50%; transform: translateX(-50%); z-index: 5; background: var(--mine); color: #fff; padding: 3px 10px; border-radius: 5px; font-weight: 600; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow-y: auto; padding: 8px 10px; }
h3 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
.box div { margin: 2px 0; }
.mono { font-family: ui-monospace, monospace; }
.tools { display: flex; flex-wrap: wrap; gap: 4px; }
.lvl { display: grid; grid-template-columns: 70px 80px 1fr auto; gap: 4px; align-items: center; margin: 3px 0; }
.lvl input[type=number] { width: 70px; }
.lvl .note { grid-column: 1 / -1; }
.res { border: 2px solid var(--accent); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.res .big { font-size: 16px; font-weight: 700; font-family: ui-monospace, monospace; }
#palette { gap: 3px; padding: 4px 6px; }
.mtool { padding: 0 6px; font-size: 12px; border-radius: 5px; border: 1px solid var(--line); cursor: pointer; user-select: none; }
.mtool.bs { border-color: var(--bs); } .mtool.ss { border-color: var(--ss); } .mtool.ar { border-color: var(--area); border-style: dashed; }
.mtool.on { background: var(--mine); color: #fff; border-color: var(--mine); font-weight: 600; }
#chart { position: relative; }
.step { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
.step.on { border: 2px solid var(--accent); }
.step .hd { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.step textarea { min-height: 38px; margin-top: 3px; width: 100%; }
.mk { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--line); }
.kind-cut { color: var(--down); font-weight: 600; } .kind-won { color: var(--up); font-weight: 600; }
textarea { width: 100%; min-height: 60px; }
#status { margin-left: auto; }
@media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } .chartbox { height: 70vh; } }
</style>
</head>
<body>
<header>
  <span class="t">Engine Trades</span>
  <button id="prev" title="previous (←)">◀</button>
  <select id="pick"></select>
  <button id="next" title="next (→)">▶</button>
  <span id="meta"></span>
  <span id="status" class="muted"></span><button id="theme" title="light / dark">☾ dark</button>
</header>
<div class="wrap">
  <div class="chartbox">
    <div class="tabs">
      <span class="tab" data-tf="1M">M</span><span class="tab" data-tf="1w">W</span><span class="tab" data-tf="1d">D</span><span class="tab" data-tf="4h">4H</span><span class="tab" data-tf="1h">1H</span><span class="tab" data-tf="15m">15m</span><span class="tab" data-tf="5m">5m</span>
      <span class="muted" style="margin-left:10px">show:</span>
      <span class="chip on" data-f="engine">engine trade</span><span class="chip on" data-f="areas">areas considered</span><span class="chip" data-f="range">range (EQ / OTE)</span>
      <span class="muted" style="margin-left:10px">watch:</span>
      <button id="w1" title="one candle of this timeframe (N)">+1 candle</button><button id="w60" title="one hour">+1h</button>
      <button id="wzone" title="jump to the first touch of the zone (the engine's array, or your last zone mark)">to the zone</button>
      <button id="wreset" title="back to the decision">reset</button><span id="wat" class="pill"></span>
    </div>
    <div class="tabs" id="palette"></div>
    <div id="hint"></div>
    <div id="chart"></div>
  </div>
  <aside>
    <div class="box" id="facts"></div>
    <h3>Your verdict</h3>
    <select id="verdict" style="width:100%">
      <option value="">— pick one —</option>
      <option value="take">take it — zone, confirmation, entry and stop all right</option>
      <option value="right_zone_wrong_entry">right zone — I'd confirm / enter differently (move the lines)</option>
      <option value="flip_right">the flip was right</option>
      <option value="flip_wrong">the flip was wrong — the zone was still valid / no trade</option>
      <option value="adjust">right idea — different array / entry / stop / TP (move the lines)</option>
      <option value="wrong_array">right side, wrong array — mark the one you'd use</option>
      <option value="wrong_side">wrong side — I'd trade the other way (place it)</option>
      <option value="watch">wait for more at the zone — I stepped forward and entered on confirmation</option>
      <option value="flip">waiting for more flipped it — the trade became the other side</option>
      <option value="missed">waiting for more = missed — the trade left without me</option>
      <option value="wait">no trade here — wait</option>
      <option value="engine_wait_ok">engine waited — agree</option>
      <option value="engine_wait_trade">engine waited — I'd trade (place it)</option>
    </select>
    <h3>Your plan — drag the engine's lines, or click a tool then the chart</h3>
    <div class="tools">
      <button data-tool="stop">set stop</button><button data-tool="tp">+ add TP</button><button data-tool="entry">set entry</button>
      <label class="muted" style="margin-left:auto"><input type="checkbox" id="be"> stop to entry after TP1</label>
    </div>
    <div id="levels" style="margin-top:6px"></div>
    <div class="res" id="res"></div>
    <h3>Your breakdown — top down <span class="muted" style="text-transform:none">(click a timeframe to view it; marks are tagged with it)</span></h3>
    <div id="steps"></div>
    <h3>What you placed</h3>
    <div id="mymarks"></div>
    <h3>Why</h3>
    <textarea id="notes" placeholder="Which array fits this move and why; where the stop belongs; where price is drawn to…"></textarea>
    <div style="display:flex;gap:6px;margin:8px 0 14px;align-items:center">
      <button class="primary" id="save">Save</button><span id="saved" class="muted"></span>
    </div>
  </aside>
</div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP" crossorigin="anonymous"></script>
<script src="linedrag.js"></script>
<script src="marks.js"></script>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = x => x == null ? "–" : (+x).toFixed(2);
const STOP_WHY = ["beyond the sweep extreme", "beyond 5m swing", "beyond 15m swing", "beyond 1h swing", "beyond 4h swing",
  "beyond FVG / imbalance", "beyond order block", "beyond liquidity level", "beyond the range", "other"];
const TP_WHY = ["swing high/low", "equal highs/lows", "session high/low (Asia/London)", "PDH/PDL", "PWH/PWL",
  "FVG / imbalance", "range 50%", "opposite range end", "other"];
const st = { ids: [], i: 0, it: null, tf: "4h", answers: {}, tool: null, filt: { engine: true, areas: true, range: false } };
let drafts = {};
try { drafts = JSON.parse(localStorage.getItem("trade-drafts") || "{}"); } catch (e) {}
try { Object.assign(st.filt, JSON.parse(localStorage.getItem("trade-filt") || "{}")); } catch (e) {}
const saveDrafts = () => { try { localStorage.setItem("trade-drafts", JSON.stringify(drafts)); } catch (e) {} };
const draft = () => { const d = (drafts[st.it.id] ||= { stop: null, tps: [], entry: null, be: false, notes: "", verdict: "" });
  d.marks ||= []; d.steps ||= {}; return d; };
const TFS = [["1M", "Monthly"], ["1w", "Weekly"], ["1d", "Daily"], ["4h", "4H"], ["1h", "1H"], ["15m", "15m"], ["5m", "5m"]];
function stepsBox() {
  const d = draft();
  $("steps").innerHTML = TFS.map(([tf, nm]) => `<div class="step ${st.tf === tf ? "on" : ""}" data-tf="${tf}">
    <div class="hd"><b>${nm}</b><span class="muted">${d.marks.filter(m => m.tf === tf).length} marks</span></div>
    <textarea data-tf="${tf}" placeholder="what you see on the ${nm.toLowerCase()}">${(d.steps[tf] || "").replace(/</g, "&lt;")}</textarea></div>`).join("");
  $("steps").querySelectorAll(".hd").forEach(h => h.onclick = () => { st.tf = h.parentElement.dataset.tf; render(); });
  $("steps").querySelectorAll("textarea").forEach(t => t.oninput = () => { d.steps[t.dataset.tf] = t.value; saveDrafts(); });
}
function marksBox() {
  const d = draft(), f = x => x == null ? "–" : (+x).toFixed(2);
  $("mymarks").innerHTML = d.marks.length ? d.marks.map((m, i) => `<div class="mk"><span><b>${m.tf}</b> ${m.kind}${m.side === "buyside" ? " ↑" : m.side === "sellside" ? " ↓" : ""}
      <span class="mono">${m.shape === "zone" ? f(m.bottom) + "–" + f(m.top) : m.shape === "trend" ? f(m.p0) + "→" + f(m.p1) : f(m.price)}</span></span>
      <span></span><button data-del="${i}" title="remove">✕</button></div>`).join("")
    : '<div class="muted">Pick a type in the <b>place:</b> row under the timeframes, then click the chart (a level runs to the end) or drag start → finish. Weekly / daily marks show on every lower timeframe.</div>';
  $("mymarks").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { d.marks.splice(+b.dataset.del, 1); saveDrafts(); marksBox(); stepsBox(); layer.redraw(); });
}

const chart = LightweightCharts.createChart($("chart"), { autoSize: true,
  layout: { background: { color: css("--panel") }, textColor: css("--muted") },
  grid: { vertLines: { color: css("--grid") }, horzLines: { color: css("--grid") } },
  rightPriceScale: { borderColor: css("--line") }, timeScale: { borderColor: css("--line"), timeVisible: true },
  crosshair: { mode: 0 } });
const series = chart.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"), borderVisible: false,
  wickUpColor: css("--up"), wickDownColor: css("--down") });
let lines = [];
const line = (price, color, width, style, title) => lines.push(series.createPriceLine({ price, color, lineWidth: width, lineStyle: style, axisLabelVisible: true, title }));

// the engine's trade: known only from the moment it confirmed (watch mode), all of it after the save
const E = () => { const c = st.it.conf || {}; return c.entry != null ? c : null; };
const seen = t => t != null && (!hidden() || cut() >= t);
function drawLines() {
  lines.forEach(l => series.removePriceLine(l)); lines = [];
  const it = st.it, d = draft();
  if (st.filt.areas) (it.considered || []).filter(c => !c.picked).forEach(c => {   // the other areas it weighed
    lines.push(series.createPriceLine({ price: c.top, color: css("--area"), lineWidth: 1, lineStyle: 1, axisLabelVisible: false, title: "" }));
    lines.push(series.createPriceLine({ price: c.bottom, color: css("--area"), lineWidth: 1, lineStyle: 1, axisLabelVisible: false, title: "considered: " + c.label }));
  });
  if (st.filt.engine && it.array) {            // ONE array: where it is looking
    const A = it.array;
    lines.push(series.createPriceLine({ price: A.top, color: css("--arr"), lineWidth: 2, lineStyle: 2, axisLabelVisible: false, title: "" }));
    lines.push(series.createPriceLine({ price: A.bottom, color: css("--arr"), lineWidth: 2, lineStyle: 2, axisLabelVisible: false, title: "watching: " + A.label }));
  }
  if (st.filt.range && it.range) {
    const R = it.range, short = it.side === "short", ext = short ? R.lo : R.hi, fk = short ? R.hi : R.lo, lv = q => ext + (fk - ext) * q;
    line(fk, css("--muted"), 1, 0, "range 1 (fake-out)"); line(lv(0.5), css("--muted"), 1, 2, "EQ");
    line(lv(0.62), css("--muted"), 1, 3, "0.62"); line(lv(0.79), css("--muted"), 1, 3, "0.79"); line(ext, css("--muted"), 1, 0, "range 0");
  }
  const C = E();
  if (st.filt.engine && C && seen(C.confirmed)) {     // the confirmed trade (support entry, or the flip)
    const fl = C.stage === "flip" ? "flip " : "";
    line(C.entry, css("--entry"), 2, 0, `engine ${fl}entry`); line(C.stop, css("--stop"), 2, 0, `engine ${fl}stop`);
    line(C.tp1, css("--tp"), 1, 0, `engine ${fl}TP1`); if (Math.abs(C.final - C.tp1) > 1e-9) line(C.final, css("--tp"), 1, 2, `engine ${fl}final`);
  } else if (st.filt.engine && it.tp1 != null) {      // before a confirmation: the plan's invalidation and targets
    line(it.stop, css("--stop"), 1, 1, "plan stop (beyond the fake-out)");
    line(it.tp1, css("--tp"), 1, 1, "plan TP1"); if (Math.abs(it.final - it.tp1) > 1e-9) line(it.final, css("--tp"), 1, 3, "plan final");
  }
  if (d.entry != null) line(d.entry, css("--mine"), 2, 0, "your entry");
  if (d.stop) line(d.stop.price, css("--mystop"), 3, 1, "your stop");
  d.tps.forEach((t, i) => line(t.price, css("--mine"), 3, 1, `your TP${i + 1} ${t.pct}%`));
}

// re-entry review: everything after the re-entry decision stays hidden until you save (closed candles only)
const TF_SEC = { "1M": 2678400, "1w": 604800, "1d": 86400, "4h": 14400, "1h": 3600, "15m": 900, "5m": 300 };
const hidden = () => st.it && !st.answers[st.it.id];   // everything after the watch point stays hidden until you save
// watch mode: step price forward from the decision (closed candles + the forming one from 5m), act when you would
const cut = () => { const d = draft(); return d.cut || st.it.decided; };
function visible(tf) {
  const all = st.it.panels[tf] || [];
  if (!hidden()) return all;
  const c = cut(), f5 = st.it.panels["5m"] || [];
  if (tf === "1M") {
    const pre = (st.it.panels["1M_pre"] || []).map(x => x.slice()), extra = f5.filter(x => x[0] >= st.it.decided && x[0] + 300 <= c);
    if (pre.length) { const L = pre[pre.length - 1]; for (const x of extra) { L[2] = Math.max(L[2], x[2]); L[3] = Math.min(L[3], x[3]); L[4] = x[4]; } }
    return pre;
  }
  const rows = all.filter(x => x[0] + TF_SEC[tf] <= c);
  const forming = all.find(x => x[0] < c && x[0] + TF_SEC[tf] > c);
  if (forming && tf !== "5m") {
    const parts = f5.filter(x => x[0] >= forming[0] && x[0] + 300 <= c);
    if (parts.length) rows.push([forming[0], parts[0][1], Math.max(...parts.map(x => x[2])), Math.min(...parts.map(x => x[3])), parts[parts.length - 1][4]]);
  }
  return rows;
}
function watchTo(t) { const d = draft(), end = (st.it.panels["5m"] || []).slice(-1)[0];
  d.cut = Math.max(st.it.decided, Math.min(t, end ? end[0] + 300 : t)); saveDrafts(); setData(); resBox(); }
function toZone() {
  const d = draft(), z = st.it.array || [...d.marks].reverse().find(m => m.shape === "zone");
  if (!z) { $("wat").textContent = "no zone: mark one first"; return; }
  const hit = (st.it.panels["5m"] || []).find(x => x[0] >= cut() && x[3] <= z.top && x[2] >= z.bottom);
  if (hit) watchTo(hit[0] + 300); else $("wat").textContent = "the zone is not reached";
}
function setData() { facts();
  const rows = visible(st.tf);
  const w = cut(); $("wat").textContent = hidden() ? (w > st.it.decided ? "watching: " + new Date(w * 1000).toISOString().slice(5, 16).replace("T", " ") + " (NY wall)" : "at the decision") : "revealed";
  st.times = rows.map(c => c[0]);
  series.setData(rows.map(c => ({ time: c[0], open: c[1], high: c[2], low: c[3], close: c[4] })));
  const P = null, mk = [];
  if (P) {                                   // the first (stopped) trade of this window
    if (P.filled) mk.push({ time: snap(P.filled), position: P.side === "long" ? "belowBar" : "aboveBar", color: css("--muted"), shape: P.side === "long" ? "arrowUp" : "arrowDown", text: "1st trade" });
    if (P.exit_at) mk.push({ time: snap(P.exit_at), position: "inBar", color: css("--stop"), shape: "square", text: "1st stopped" });
  }
  mk.push({ time: snap(st.it.decided), position: st.it.side === "long" ? "belowBar" : "aboveBar", color: css("--key"), shape: st.it.side === "long" ? "arrowUp" : st.it.side === "short" ? "arrowDown" : "circle", text: "now" });
  const C = st.it.conf || {};
  if (seen(C.armed)) mk.push({ time: snap(C.armed), position: "inBar", color: css("--arr"), shape: "circle", text: `zone touched — watching ${st.it.ctf}` });
  if (seen(C.confirmed)) mk.push({ time: snap(C.confirmed - 60), position: C.side === "long" ? "belowBar" : "aboveBar", color: css("--entry"),
    shape: C.side === "long" ? "arrowUp" : "arrowDown", text: C.stage === "flip" ? "against: closed through → flip" : "support: FVG our way" });
  if (C.filled && seen(C.filled)) mk.push({ time: snap(C.filled), position: "inBar", color: css("--entry"), shape: "circle", text: "fill" });
  if (C.exit_at && !hidden()) mk.push({ time: snap(C.exit_at), position: "inBar", color: C.exit === "stop" ? css("--stop") : css("--tp"), shape: "square", text: C.exit });
  series.setMarkers(mk.filter(m => m.time != null && (!hidden() || m.time <= cut())).sort((a, b) => a.time - b.time));
  const fk = st.it.id + st.tf;                       // keep the zoom while stepping forward
  if (st.fitKey !== fk) { chart.timeScale().fitContent(); st.fitKey = fk; }
  drawLines();
}
function snap(t) {   // marker time → the bar that contains it on this panel
  const rows = st.it.panels[st.tf] || []; let best = null;
  for (const c of rows) { if (c[0] <= t) best = c[0]; else break; }
  return best;
}

// replay on the 1m path (high/low per bar from the decision to 16:55); same-bar stop and target → stop first
function replay() {
  const it = st.it, d = draft();
  const C = E() || {};
  const entry = d.entry != null ? d.entry : C.entry, stop = d.stop ? d.stop.price : C.stop;
  if (entry == null || stop == null) return { error: it.side === "wait" ? "the engine waited — place an entry, stop and TP to replay your own trade"
    : `the engine took no trade (${(it.conf || {}).outcome}) — place an entry, stop and TP to replay yours` };
  const long = stop < entry, sgn = long ? 1 : -1;
  const tps = d.tps.length ? d.tps.map(t => ({ ...t })) : (C.tp1 != null ? [{ price: C.tp1, pct: 50 }, { price: C.final, pct: 50 }] : []);
  if (!tps.length) return { error: "add a TP" };
  const risk = (entry - stop) * sgn;
  if (!(risk > 0)) return { error: "stop must be on the far side of the entry" };
  if (tps.some(t => (t.price - entry) * sgn <= 0)) return { error: "every TP must be beyond the entry" };
  tps.sort((a, b) => (a.price - b.price) * sgn);
  const total = tps.reduce((s, t) => s + (+t.pct || 0), 0) || 100;
  let filled = null, cur = stop, left = 1, r = 0, k = 0, ev = [];
  const start = d.entry != null ? (d.entry_at || it.decided) : (C.filled || C.confirmed || it.decided);   // your entry: from when you placed it
  for (const [t, h, l] of it.path) {
    if (t < start) continue;
    if (filled == null) {
      if (d.entry == null && C.filled) filled = t;
      else if (long ? l <= entry : h >= entry) filled = t;
      if (filled == null) continue;
      ev.push(`filled ${new Date(t * 1000).toISOString().slice(11, 16)}`);
    }
    if (long ? l <= cur : h >= cur) { r += left * (cur - entry) * sgn / risk; ev.push(`stopped ${new Date(t * 1000).toISOString().slice(11, 16)} at ${fmt(cur)}`); left = 0; break; }
    while (k < tps.length && (long ? h >= tps[k].price : l <= tps[k].price)) {
      const part = Math.min(left, (+tps[k].pct || 0) / total);
      r += part * (tps[k].price - entry) * sgn / risk; left -= part;
      ev.push(`TP${k + 1} ${new Date(t * 1000).toISOString().slice(11, 16)} (${Math.round(part * 100)}%)`);
      if (k === 0 && d.be) cur = entry;
      k++;
    }
    if (left <= 1e-9) break;
  }
  if (filled == null) return { r: 0, ev: ["not filled before the plan's horizon"], risk, engine: (it.conf || {}).runner_r };
  if (left > 1e-9) { const last = it.path[it.path.length - 1]; const px = (last[1] + last[2]) / 2;
    r += left * (px - entry) * sgn / risk; ev.push(`rest closed at the horizon ≈ ${fmt(px)}`); }
  const er = C.entry != null ? Math.abs(C.entry - C.stop) : null;
  return { r, ev, risk, rEngine: er ? r * risk / er : null, engine: (it.conf || {}).runner_r };
}

function levelsBox() {
  const d = draft();
  const sel = (opts, v, k) => `<select data-k="${k}">${opts.map(o => `<option ${o === v ? "selected" : ""}>${o}</option>`).join("")}</select>`;
  let h = "";
  if (d.entry != null) h += `<div class="lvl"><b class="mono">${fmt(d.entry)}</b><span>entry</span><span></span><button data-del="entry">✕</button></div>`;
  if (d.stop) h += `<div class="lvl" data-w="stop"><b class="mono">${fmt(d.stop.price)}</b><span>stop</span>${sel(STOP_WHY, d.stop.why, "why")}<button data-del="stop">✕</button></div>`;
  d.tps.forEach((t, i) => { h += `<div class="lvl" data-w="tp" data-i="${i}"><b class="mono">${fmt(t.price)}</b><span>TP${i + 1} <input type="number" min="0" max="100" step="5" data-k="pct" value="${t.pct}">%</span>${sel(TP_WHY, t.why, "why")}<button data-del="tp${i}">✕</button></div>`; });
  $("levels").innerHTML = h || '<div class="muted">Nothing placed yet — the replay below uses the engine plan.</div>';
  $("levels").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const k = b.dataset.del; if (k === "entry") d.entry = null; else if (k === "stop") d.stop = null; else d.tps.splice(+k.slice(2), 1);
    saveDrafts(); refresh(); });
  $("levels").querySelectorAll(".lvl[data-w]").forEach(el => el.querySelectorAll("[data-k]").forEach(inp => inp.onchange = inp.oninput = () => {
    const o = el.dataset.w === "stop" ? d.stop : d.tps[+el.dataset.i]; o[inp.dataset.k] = inp.dataset.k === "pct" ? +inp.value : inp.value;
    saveDrafts(); drawLines(); resBox(); }));
}

function resBox() {
  if (hidden()) { $("res").innerHTML = '<div class="muted">What happened next — the engine\'s result and the replay of your plan — is revealed when you save.</div>'; return; }
  const x = replay(), d = draft(), mine = d.stop || d.tps.length || d.entry != null;
  if (x.error) { $("res").innerHTML = `<b style="color:var(--mystop)">${x.error}</b>` + (st.it.touch ? `<div class="muted">first plan (fill on touch): ${(+st.it.touch.runner_r).toFixed(2)} R — ${st.it.touch.outcome}</div>` : ""); return; }
  $("res").innerHTML = `<div class="muted">${mine ? "Your handling, replayed on the 1m path:" : "Engine plan replayed (place your own levels to compare):"}</div>
    <div class="big">${x.r >= 0 ? "+" : ""}${x.r.toFixed(2)} R <span class="muted" style="font-size:12px">on your risk ${fmt(x.risk)}</span></div>
    ${x.rEngine != null && mine ? `<div>= ${x.rEngine >= 0 ? "+" : ""}${x.rEngine.toFixed(2)} × the engine's risk</div>` : ""}
    <div>engine (confirmation): ${st.it.side === "wait" ? "waited" : `<b class="mono">${x.engine >= 0 ? "+" : ""}${(+x.engine).toFixed(2)} R</b> — ${st.it.conf.outcome}`}</div>
    ${st.it.touch ? `<div class="muted">first plan (fill on touch): ${st.it.touch.runner_r >= 0 ? "+" : ""}${(+st.it.touch.runner_r).toFixed(2)} R — ${st.it.touch.outcome}</div>` : ""}
    <div class="muted mono" style="font-size:11px">${x.ev.join(" → ")}</div>`;
}

function facts() {
  const it = st.it, esc = x => String(x).replace(/</g, "&lt;"), C = it.conf || {}, A = it.array;
  const read = (it.read || []).map(x => `<div style="margin:3px 0">${esc(x.text)}</div>`).join("");
  const t = x => new Date(x * 1000).toISOString().slice(5, 16).replace("T", " ");
  let head;
  if (it.side === "wait") head = `<div><b>ENGINE WAITS</b> — ${esc(it.wait)}</div>`;
  else {
    const short = it.side === "short", far = short ? A.top : A.bottom;
    head = `<div><b>${it.side.toUpperCase()}</b> idea · looking at the <b style="color:var(--arr)">${esc(A.label)} ${fmt(A.bottom)}–${fmt(A.top)}</b>
         <span class="muted">(depth ${A.d0.toFixed(2)}–${A.d1.toFixed(2)} of the ${it.rtf} range)</span></div>
       <div class="muted">why this one: ${esc(it.why)}</div>
       <div><b>Areas considered</b> (${(it.considered || []).length}): ${(it.considered || []).map(c => `<span class="mono" style="${c.picked ? "color:var(--arr);font-weight:600" : "color:var(--area)"}">${esc(c.label)} ${fmt(c.bottom)}–${fmt(c.top)} <span class="muted">d ${c.d0.toFixed(2)}–${c.d1.toFixed(2)}</span></span>`).join(" · ")}</div>
       <div><b>Waiting for</b> price to reach ${fmt(it.entry)}, then on the <b>${it.ctf}</b>:
         <br>· support = a new ${it.ctf} FVG ${short ? "down" : "up"} → ${short ? "sell" : "buy"} its near edge, stop beyond the reaction ${short ? "high" : "low"}
         <br>· against = a ${it.ctf} close ${short ? "above" : "below"} ${fmt(far)} → flip ${short ? "long" : "short"} on the retest of ${fmt(far)}
         <br><span class="muted">cancelled if ${fmt(it.stop)} trades first; missed (no chase) if ${fmt(it.tp1)} trades first</span></div>
       <div class="mono muted">plan stop ${fmt(it.stop)} · TP1 ${fmt(it.tp1)} (${esc(it.tp1_name)}) · final ${fmt(it.final)} (${esc(it.final_name)})</div>`;
    if (seen(C.armed)) head += `<div style="margin-top:4px">● zone touched ${t(C.armed)} — watching the ${it.ctf}</div>`;
    if (seen(C.confirmed) && C.entry != null) head += `<div><b style="color:var(--entry)">${C.stage === "flip" ? "AGAINST → FLIP " + C.side.toUpperCase() : "SUPPORT → " + C.side.toUpperCase()}</b> confirmed ${t(C.confirmed)}:
         <span class="mono">entry ${fmt(C.entry)} · stop ${fmt(C.stop)} (risk ${fmt(Math.abs(C.entry - C.stop))}) · TP1 ${fmt(C.tp1)} · final ${fmt(C.final)}</span></div>`;
    if (!hidden()) head += `<div class="muted">engine: ${esc(C.outcome || "")}</div>`;
  }
  $("facts").innerHTML = head + `<details style="margin-top:6px"><summary class="muted">the engine's read (${esc(it.read_kind)})</summary>${read}</details>`;
}

function refresh() { levelsBox(); drawLines(); resBox(); }
function render() {
  const d = draft();
  $("meta").innerHTML = `${st.it.label} · price ${fmt(st.it.price)} · ADR ${fmt(st.it.adr)}`;
  $("status").textContent = `${st.i + 1}/${st.ids.length} · saved ${Object.keys(st.answers).filter(k => st.ids.includes(k)).length}`;
  $("notes").value = d.notes || ""; $("be").checked = !!d.be;
  $("verdict").value = d.verdict || "";
  $("saved").textContent = st.answers[st.it.id] ? "saved ✓" : "";
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tf === st.tf));
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", !!st.filt[c.dataset.f]));
  facts(); setData(); refresh(); stepsBox(); marksBox(); layer.redraw();
}
async function load(i) {
  st.i = (i + st.ids.length) % st.ids.length; setTool(null);
  st.it = await (await fetch(`s/${st.ids[st.i]}.json`)).json();
  $("pick").value = st.ids[st.i];
  try { localStorage.setItem("trade-at", st.ids[st.i]); } catch (e) {}
  render();
}
function setTool(t) {
  st.tool = st.tool === t ? null : t;
  if (st.tool && typeof layer !== "undefined") layer.setPlace(null);
  document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("armed", b.dataset.tool === st.tool));
  $("hint").style.display = st.tool ? "block" : "none";
  $("hint").textContent = st.tool ? `click the chart to place your ${st.tool === "tp" ? "TP" : st.tool}` : "";
}
const layer = marksLayer(chart, series, $("chart"), {
  list: () => st.it ? draft().marks : [], times: () => st.times || [], nowT: () => null, paletteEl: $("palette"), color: css,
  tfName: () => st.tf, onPlace: on => { if (on && st.tool) setTool(st.tool); },
  changed: () => { saveDrafts(); marksBox(); stepsBox(); },
});
lineDrag(chart, series, $("chart"), {
  targets: () => {
    const it = st.it, d = draft(), out = [];
    if (d.entry != null) out.push({ key: "entry", price: d.entry });
    if (d.stop) out.push({ key: "stop", price: d.stop.price });
    d.tps.forEach((t, i) => out.push({ key: "tp" + i, price: t.price }));
    const C = E();
    if (st.filt.engine && C && seen(C.confirmed)) {          // grabbing an engine line makes your own copy of it
      if (d.entry == null) out.push({ key: "entry", price: C.entry });
      if (!d.stop) out.push({ key: "stop", price: C.stop });
      if (!d.tps.length) out.push({ key: "eng-tp1", price: C.tp1 });
      if (d.tps.length < 2 && Math.abs(C.final - C.tp1) > 1e-9) out.push({ key: "eng-final", price: C.final });
    }
    return out;
  },
  move: (key, price) => {
    const d = draft();
    if (key === "entry") { d.entry = price; d.entry_at = cut(); }
    else if (key === "stop") d.stop = { price, why: d.stop ? d.stop.why : STOP_WHY[0] };
    else if (key.startsWith("tp")) d.tps[+key.slice(2)].price = price;
    else if (key === "eng-tp1" || key === "eng-final") {
      if (!d.tps.length) d.tps.push({ price: E().tp1, pct: 50, why: TP_WHY[0] });
      if (key === "eng-final") { d.tps.push({ price, pct: 50, why: TP_WHY[0] }); key = "tp" + (d.tps.length - 1); }
      else { d.tps[0].price = price; key = "tp0"; }
    }
    drawLines();
    return key;
  },
  done: () => { saveDrafts(); refresh(); },
});
chart.subscribeClick(p => {
  if (Date.now() - lineDrag.lastDrag < 300) return;
  if (!st.tool || !p.point) return;
  const price = series.coordinateToPrice(p.point.y); if (price == null) return;
  const v = Math.round(price * 100) / 100, d = draft();
  if (st.tool === "stop") d.stop = { price: v, why: d.stop ? d.stop.why : STOP_WHY[0] };
  else if (st.tool === "entry") { d.entry = v; d.entry_at = cut(); }
  else d.tps.push({ price: v, pct: d.tps.length ? 25 : 50, why: TP_WHY[0] });
  setTool(null);                                            // one placement per pick
  saveDrafts(); refresh();
});
document.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => setTool(b.dataset.tool));
$("be").onchange = () => { draft().be = $("be").checked; saveDrafts(); resBox(); };
$("notes").oninput = () => { draft().notes = $("notes").value; saveDrafts(); };
$("verdict").onchange = () => { draft().verdict = $("verdict").value; saveDrafts(); };
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { st.tf = t.dataset.tf; render(); });
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { st.filt[c.dataset.f] = !st.filt[c.dataset.f];
  try { localStorage.setItem("trade-filt", JSON.stringify(st.filt)); } catch (e) {} render(); });
$("w1").onclick = () => watchTo(cut() + Math.max(300, TF_SEC[st.tf]));
$("w60").onclick = () => watchTo(cut() + 3600);
$("wzone").onclick = toZone;
$("wreset").onclick = () => { const d = draft(); d.cut = null; saveDrafts(); setData(); resBox(); };
$("prev").onclick = () => load(st.i - 1); $("next").onclick = () => load(st.i + 1);
$("pick").onchange = () => load(st.ids.indexOf($("pick").value));
document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.key === "ArrowLeft") load(st.i - 1); else if (e.key === "ArrowRight") load(st.i + 1);
  else if ("1234567".includes(e.key)) { st.tf = ["1M", "1w", "1d", "4h", "1h", "15m", "5m"][+e.key - 1]; render(); }
  else if (e.key === "Escape") setTool(null);
  else if (e.key === "n" && hidden()) watchTo(cut() + Math.max(300, TF_SEC[st.tf]));
  else if (e.key === "s") setTool("stop"); else if (e.key === "t") setTool("tp"); else if (e.key === "e") setTool("entry");
});
$("save").onclick = async () => {
  const d = draft(), x = replay();
  const body = { watched_to: cut(), entry_at: d.entry_at || null, id: st.it.id, asset: st.it.asset, side: st.it.side, kind: st.it.kind, engine: { plan: { entry: st.it.entry, stop: st.it.stop, tp1: st.it.tp1, final: st.it.final }, conf: st.it.conf || null, touch: st.it.touch || null, array: st.it.array || null, considered: st.it.considered || null, wait: st.it.wait || null }, bucket: st.it.bucket || null,
                 entry: d.entry, stop: d.stop, tps: d.tps, be: d.be, notes: d.notes, verdict: d.verdict || null, marks: d.marks, steps: d.steps, replay_r: x.r ?? null, replay_events: x.ev ?? [] };
  const r = await fetch("api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { $("saved").textContent = "save failed — is the server running?"; return; }
  st.answers[st.it.id] = body; render();
};
(function () {
  const root = document.documentElement, btn = $("theme"); let t = "light";
  try { t = localStorage.getItem("trade-theme") || "light"; } catch (e) {}
  const set = v => { root.dataset.theme = v; btn.textContent = v === "light" ? "☾ dark" : "☀ light"; };
  set(t);
  btn.onclick = () => { const v = root.dataset.theme === "light" ? "dark" : "light"; set(v);
    try { localStorage.setItem("trade-theme", v); } catch (e) {} location.reload(); };
})();
(async () => {
  const idx = await (await fetch("index.json")).json();
  st.ids = idx.ids;
  try { st.answers = await (await fetch("api/answers")).json(); } catch (e) { st.answers = {}; }
  const label = id => { const p = id.split("-"); const d = p[2], t = p[3]; return `${p[1]} ${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)} ${t.slice(0, 2)}:${t.slice(2)}`; };
  $("pick").innerHTML = st.ids.map(id => `<option value="${id}">${st.answers[id] ? "✓ " : ""}${label(id)}</option>`).join("");
  let start = 0;
  try { const at = localStorage.getItem("trade-at"); if (at && st.ids.includes(at)) start = st.ids.indexOf(at); } catch (e) {}
  load(start);
})();
</script>
</body>
</html>
