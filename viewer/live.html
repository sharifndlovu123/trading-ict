<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Live Sheet</title>
<style>
:root { --bg:#f2f3f0; --panel:#fcfcfb; --ink:#141614; --ink2:#52514e; --line:#d9ddd7; --pos:#1f7a55; --neg:#b23b3b;
  --up:#2a78d6; --down:#eb6834; --warn:#9a6a00; --accent:#2a78d6; --area:#8a63d2; }
@media (prefers-color-scheme: dark) { :root { --bg:#111110; --panel:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --line:#34342f;
  --pos:#4cc28c; --neg:#e66767; --up:#3987e5; --down:#d95926; --warn:#e0b040; --accent:#3987e5; --area:#a98be6; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif; }
main { max-width:1250px; margin:0 auto; padding:14px 16px 60px; }
h1 { font-size:20px; margin:0; } h2 { font-size:15px; margin:0 0 6px; }
.top { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; margin-bottom:10px; }
.dim { color:var(--ink2); } .num { font-family:ui-monospace,Menlo,monospace; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; }
.grid { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:12px; align-items:start; }
@media (max-width:980px) { .grid { grid-template-columns:1fr; } }
button, select, input, textarea { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:4px 9px; }
button { cursor:pointer; } button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
textarea { width:100%; min-height:44px; resize:vertical; } input.px { width:96px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:13px; }
.chip.warn { border-color:var(--warn); color:var(--warn); } .chip.good { border-color:var(--pos); color:var(--pos); }
.verdict { font-weight:600; } .verdict.yes { color:var(--pos); } .verdict.no { color:var(--neg); }
#chart { height:480px; }
.plan { border-left:4px solid var(--line); } .plan.long { border-left-color:var(--up); } .plan.short { border-left-color:var(--down); }
.plan.sel { outline:2px solid var(--accent); }
.row { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:6px; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:13px; margin-top:4px; }
.res { margin-top:6px; padding:5px 8px; border-radius:5px; background:var(--bg); }
details { margin-top:6px; } summary { cursor:pointer; color:var(--ink2); }
.gate { font-size:12.5px; } .gate.f { color:var(--neg); }
.saved { color:var(--pos); font-size:13px; }
</style>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP" crossorigin="anonymous"></script>
</head>
<body>
<main>
  <div class="top">
    <h1>Recipe live sheet</h1>
    <span id="when" class="dim"></span>
    <span id="fresh" class="dim"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="cond"></div>
  <div class="grid">
    <div>
      <div class="card">
        <div class="row" style="margin-top:0">
          <span class="tabs" id="tfs"></span>
          <span class="dim" id="legend">Prices are the CFD's (not the futures'). Dotted = session levels · purple = the higher-timeframe area · blue / red / green = entry / stop / TP1 of the selected plan.</span>
        </div>
        <div id="chart"></div>
      </div>
    </div>
    <div>
      <div class="card" id="read"></div>
      <div id="plans"></div>
      <div class="card" id="blocked"></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const st = { doc: null, asset: null, tf: "15m", answers: {}, sel: null, sig: "", dirty: false, lines: [] };

const chart = LightweightCharts.createChart($("chart"), { autoSize: true,
  layout: { background: { color: "transparent" }, textColor: css("--ink2") },
  grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: css("--line") }, rightPriceScale: { borderColor: css("--line") } });
const series = chart.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"), borderVisible: false,
  wickUpColor: css("--up"), wickDownColor: css("--down") });

function line(price, color, title, style) {
  st.lines.push(series.createPriceLine({ price, color, lineWidth: 1, lineStyle: style ?? 0, axisLabelVisible: true, title }));
}
function drawChart(fit) {
  const a = st.doc.assets[st.asset];
  series.setData(a.candles[st.tf] || []);
  st.lines.forEach(l => series.removePriceLine(l)); st.lines = [];
  for (const [k, v] of Object.entries(a.levels || {})) line(v, css("--ink2"), k.replace(/_/g, " "), 1);
  const s = (a.setups || []).find(x => x.id === st.sel);
  if (s) {
    const poi = s.evidence && s.evidence.poi;
    if (poi && poi.top != null) { line(poi.top, css("--area"), `${poi.tf} ${poi.kind} top`, 2); line(poi.bottom, css("--area"), `${poi.tf} ${poi.kind} bottom`, 2); }
    if (s.plan) { line(s.plan.entry, css("--accent"), "entry"); line(s.plan.stop, css("--neg"), "stop"); line(s.plan.tp1, css("--pos"), "TP1 " + (s.plan.tp1_name || "")); }
  }
  if (fit) {
    const n = (a.candles[st.tf] || []).length, show = { "5m": 150, "15m": 110, "1h": 120 }[st.tf];
    chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - show), to: n + 6 });
  }
}

function renderTabs() {
  $("tabs").innerHTML = Object.entries(st.doc.assets).map(([k, v]) => {
    const live = (v.setups || []).filter(s => s.ok).length;
    return `<button data-a="${k}" class="${k === st.asset ? "on" : ""}">${k}${live ? ` · ${live} plan${live > 1 ? "s" : ""}` : ""}</button>`; }).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { st.asset = b.dataset.a; st.sel = null; st.sig = ""; st.dirty = false; render(true); });
  $("tfs").innerHTML = ["5m", "15m", "1h"].map(t => `<button data-t="${t}" class="${t === st.tf ? "on" : ""}">${t}</button>`).join("");
  $("tfs").querySelectorAll("button").forEach(b => b.onclick = () => { st.tf = b.dataset.t; renderTabs(); drawChart(true); });
}

function renderCond() {
  const a = st.doc.assets[st.asset], c = a.conditions;
  if (!c) { $("cond").innerHTML = `<span class="verdict no">No read for ${st.asset}</span> <span class="dim">${esc(a.error || "")}</span>`; return; }
  const why = [c.vol === "high" ? "high volatility" : null, c.news_day ? "high-impact news today" : null].filter(Boolean).join(" and ");
  const news = c.news.length ? c.news.map(n => `<span class="chip ${n.impact === "high" ? "good" : ""}">${n.time} ${esc(n.name)}</span>`).join("") : `<span class="chip">no scheduled US release</span>`;
  $("cond").innerHTML = `<span class="verdict ${c.recipe_day ? "yes" : "no"}">${c.recipe_day ? "Recipe day: " + why : "Not a recipe day: normal or low volatility and no high-impact news"}</span>
    <span class="dim"> · on record the recipe made money only on volatile or news days (found after the fact; the forward log is testing it)</span>
    <div class="chips"><span class="chip">volatility ${c.vol}</span><span class="chip">${c.state}</span><span class="chip">backdrop ${c.backdrop}</span>
    <span class="chip ${c.monday ? "warn" : ""}">${c.weekday}${c.monday ? " (Mondays lost on record)" : ""}</span>
    <span class="chip ${c.session !== "normal" ? "warn" : ""}">session: ${c.session}</span>${news}
    <span class="chip">last ${a.last} at ${a.last_bar}</span></div>`;
}

function saveBtn(id) { return `<button class="primary" data-save="${id}">Save</button> <span class="saved" id="ok-${id}">${st.answers[id] ? "saved ✓" : ""}</span>`; }
function choice(name, opts, cur) { return opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" ${cur === v ? "checked" : ""}> ${l}</label>`).join(" "); }

function renderRead() {
  const id = `${st.doc.day}-${st.asset}-read`, a = st.answers[id] || {};
  $("read").innerHTML = `<h2>My read for ${st.asset} today</h2>
    <div class="row">${choice("read", [["long", "look for longs"], ["short", "look for shorts"], ["both", "either side"], ["none", "stand aside"]], a.read)}</div>
    <textarea data-note placeholder="Why (areas, liquidity, what I'm waiting for)">${esc(a.note)}</textarea>
    <div class="row">${saveBtn(id)}</div>`;
  $("read").querySelector("[data-save]").onclick = () => save(id, { kind: "read", asset: st.asset, day: st.doc.day,
    read: ($("read").querySelector("input[name=read]:checked") || {}).value || null, note: $("read").querySelector("[data-note]").value });
}

function renderPlans() {
  const a = st.doc.assets[st.asset], live = (a.setups || []).filter(s => s.ok), rest = (a.setups || []).filter(s => !s.ok);
  $("plans").innerHTML = live.length ? live.map(s => {
    const p = s.plan, ans = st.answers[s.id] || {}, poi = s.evidence.poi || {};
    const res = !st.answers[s.id] ? `<div class="res dim">The engine's fill and result show after you save your mark.</div>`
      : `<div class="res">Engine: <b>${esc(s.result ? s.result.state : "—")}</b>${s.result && s.result.filled ? ` · filled ${s.result.filled}` : ""}${s.result && s.result.r != null ? ` · <span class="num">${s.result.r > 0 ? "+" : ""}${s.result.r} R</span>${s.result.state === "open" ? " so far" : ""}` : ""}</div>`;
    return `<div class="card plan ${s.side} ${s.id === st.sel ? "sel" : ""}" data-id="${s.id}">
      <h2>${s.side.toUpperCase()} · decided ${s.decided} <button data-show="${s.id}" style="float:right">show on chart</button></h2>
      <div class="kv num"><span class="dim">entry (limit)</span><span>${p.entry}</span><span class="dim">stop</span><span>${p.stop} (risk ${p.risk})</span>
        <span class="dim">TP1</span><span>${p.tp1} · ${esc(p.tp1_name)} · ${p.rr} R</span><span class="dim">final</span><span>${p.final} · ${esc(p.final_name)}</span>
        <span class="dim">area</span><span>${esc(poi.tf)} ${esc(poi.kind)} ${poi.bottom}–${poi.top}</span><span class="dim">order live</span><span>${p.placed} → ${p.expires}</span></div>
      <div class="row">${choice("mark-" + s.id, [["take", "I'd take it"], ["skip", "skip"], ["other", "other side"], ["mine", "my own entry"]], ans.mark)}</div>
      <div class="row"><input class="px num" data-my="entry" placeholder="my entry" value="${esc(ans.my_entry)}"><input class="px num" data-my="stop" placeholder="my stop" value="${esc(ans.my_stop)}"><input class="px num" data-my="tp" placeholder="my target" value="${esc(ans.my_tp)}"></div>
      <textarea data-note placeholder="Why">${esc(ans.note)}</textarea>
      <div class="row">${saveBtn(s.id)}</div>${res}
      <details><summary>gate trace</summary>${s.gates.map(g => `<div class="gate ${g.passed ? "" : "f"}">${g.passed ? "✓" : "✗"} ${esc(g.name)}: ${esc(g.detail)}</div>`).join("")}</details></div>`; }).join("")
    : `<div class="card dim">No plan from the recipe yet on ${st.asset}. It needs a fresh 1h/4h gap reached to its 50%, then a 15m gap in its direction, in the New York morning.</div>`;
  $("plans").querySelectorAll("[data-show]").forEach(b => b.onclick = () => { st.sel = b.dataset.show; $("plans").querySelectorAll(".plan").forEach(c => c.classList.toggle("sel", c.dataset.id === st.sel)); drawChart(false); });
  $("plans").querySelectorAll(".plan").forEach(c => {
    const s = live.find(x => x.id === c.dataset.id);
    c.querySelector("[data-save]").onclick = () => save(s.id, { kind: "plan", asset: st.asset, day: st.doc.day, side: s.side, decided: s.decided, engine_plan: s.plan,
      marked_at: st.doc.now, mark: (c.querySelector(`input[name="mark-${s.id}"]:checked`) || {}).value || null,
      my_entry: c.querySelector('[data-my=entry]').value, my_stop: c.querySelector('[data-my=stop]').value, my_tp: c.querySelector('[data-my=tp]').value,
      note: c.querySelector("[data-note]").value, recipe_day: (st.doc.assets[st.asset].conditions || {}).recipe_day });
  });
  $("blocked").innerHTML = `<h2>Looked at and not taken by the recipe <span class="dim">(${rest.length})</span></h2>` + (rest.length ? rest.map(s => {
    const f = s.gates.filter(g => !g.passed);
    return `<details><summary>${s.side} · ${s.decided} · stopped at: ${esc(f.map(g => g.name).join(", ") || "no plan")}</summary>${f.map(g => `<div class="gate f">✗ ${esc(g.name)}: ${esc(g.detail)}</div>`).join("")}
      ${s.evidence.poi ? `<div class="gate">area: ${esc(s.evidence.poi.tf)} ${esc(s.evidence.poi.kind)} ${s.evidence.poi.bottom}–${s.evidence.poi.top} <button data-show="${s.id}">show</button></div>` : ""}</details>`; }).join("") : `<div class="dim">nothing yet</div>`);
  $("blocked").querySelectorAll("[data-show]").forEach(b => b.onclick = () => { st.sel = b.dataset.show; drawChart(false); });
  document.querySelectorAll("#plans input, #plans textarea, #read input, #read textarea").forEach(e => e.addEventListener("input", () => { st.dirty = true; }));
}

async function save(id, body) {
  body.id = id;
  const r = await fetch("api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { alert("save failed"); return; }
  st.answers[id] = body; st.dirty = false; st.sig = ""; render(false);
}

function render(fit) {
  const d = st.doc;
  $("when").textContent = `${d.mode === "replay" ? "REPLAY · " : ""}New York ${d.now}`;
  renderTabs(); renderCond();
  const a = d.assets[st.asset];
  const sig = st.asset + JSON.stringify((a.setups || []).map(s => [s.id, s.ok, s.result])) + Object.keys(st.answers).length;
  if (sig !== st.sig && !st.dirty) { st.sig = sig; renderRead(); renderPlans(); }
  drawChart(fit);
}

async function poll(first) {
  try {
    const d = await (await fetch("today.json?t=" + Date.now())).json();
    const fresh = !st.doc || d.now !== st.doc.now;
    st.doc = d;
    if (!st.asset || !d.assets[st.asset]) st.asset = Object.keys(d.assets)[0];
    $("fresh").textContent = `page checked ${new Date().toLocaleTimeString()}`;
    if (first || fresh) render(first);
  } catch (e) { $("fresh").textContent = "waiting for today.json (is live_recipe.py running?)"; }
}
(async () => {
  try { st.answers = await (await fetch("api/answers")).json(); } catch (e) { st.answers = {}; }
  await poll(true);
  setInterval(() => poll(false), 20000);
})();
</script>
</body>
</html>
