<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recipe Live Sheet</title>
<style>
:root { --bg:#f2f3f0; --panel:#fcfcfb; --ink:#141614; --ink2:#52514e; --line:#d9ddd7; --pos:#1f7a55; --neg:#b23b3b;
  --up:#2a78d6; --down:#eb6834; --warn:#9a6a00; --accent:#2a78d6; --area:#8a63d2; --bs:#2b62b8; --ss:#c0562a; --mine:#138a72; }
@media (prefers-color-scheme: dark) { :root { --bg:#111110; --panel:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --line:#34342f;
  --pos:#4cc28c; --neg:#e66767; --up:#3987e5; --down:#d95926; --warn:#e0b040; --accent:#3987e5; --area:#a98be6; --bs:#7ea6e8; --ss:#f0915f; --mine:#4fd1b5; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif; }
main { max-width:1250px; margin:0 auto; padding:14px 16px 60px; }
h1 { font-size:20px; margin:0; } h2 { font-size:15px; margin:0 0 6px; }
.top { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; margin-bottom:10px; }
.dim { color:var(--ink2); } .num { font-family:ui-monospace,Menlo,monospace; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; }
.grid { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:12px; align-items:start; }
@media (max-width:980px) { .grid { grid-template-columns:1fr; } }
button, select, input, textarea { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:4px 9px; }
button { cursor:pointer; } button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
textarea { width:100%; min-height:44px; resize:vertical; } input.px { width:96px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip { border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:13px; }
.chip.warn { border-color:var(--warn); color:var(--warn); } .chip.good { border-color:var(--pos); color:var(--pos); }
.verdict { font-weight:600; } .verdict.yes { color:var(--pos); } .verdict.no { color:var(--neg); }
#chart { height:480px; position:relative; }
#palette { display:flex; flex-wrap:wrap; gap:3px; align-items:center; margin:6px 0; }
.mtool { padding:0 6px; font-size:12px; border-radius:5px; border:1px solid var(--line); cursor:pointer; user-select:none; }
.mtool.bs { border-color:var(--bs); } .mtool.ss { border-color:var(--ss); } .mtool.ar { border-color:var(--area); border-style:dashed; }
.mtool.on { background:var(--mine); color:#fff; border-color:var(--mine); font-weight:600; }
.muted { color:var(--ink2); font-size:12px; }
#chartcard.full { position:fixed; inset:0; z-index:50; margin:0; border-radius:0; display:flex; flex-direction:column; }
#chartcard:fullscreen { background:var(--panel); display:flex; flex-direction:column; padding:10px 12px; }
#chartcard.full #chart, #chartcard:fullscreen #chart { flex:1; height:auto; min-height:0; }
#chartcard.full #legend, #chartcard:fullscreen #legend { display:none; }
#notes { position:absolute; inset:0; pointer-events:none; z-index:6; overflow:hidden; }
.cnote { position:absolute; transform:translate(8px,-50%); max-width:260px; padding:2px 7px; border-radius:5px; background:var(--mine); color:#fff;
  font-size:12.5px; line-height:1.35; white-space:pre-wrap; pointer-events:auto; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.35); }
.cnote::before { content:""; position:absolute; left:-8px; top:50%; width:7px; height:7px; margin-top:-4px; border-radius:50%; background:var(--mine); }
.cnote.claude { background:var(--warn); color:#111; cursor:default; } .cnote.claude::before { background:var(--warn); }
#noteedit { position:absolute; z-index:8; display:none; width:270px; padding:6px; background:var(--panel); border:1px solid var(--mine); border-radius:6px; }
#noteedit textarea { min-height:60px; } #noteedit .row { margin-top:4px; }
#fsinfo { display:none; margin-left:auto; } #chartcard.full #fsinfo, #chartcard:fullscreen #fsinfo { display:inline; }
.plan { border-left:4px solid var(--line); } .plan.long { border-left-color:var(--up); } .plan.short { border-left-color:var(--down); }
.plan.sel { outline:2px solid var(--accent); }
.row { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:6px; }
.kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; font-size:13px; margin-top:4px; }
.res { margin-top:6px; padding:5px 8px; border-radius:5px; background:var(--bg); }
details { margin-top:6px; } summary { cursor:pointer; color:var(--ink2); }
.gate { font-size:12.5px; } .gate.f { color:var(--neg); }
.saved { color:var(--pos); font-size:13px; }
#compare table { border-collapse:collapse; width:100%; font-size:13px; } #compare .scroll { overflow-x:auto; }
#compare th, #compare td { padding:4px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
#compare th { color:var(--ink2); font-weight:500; } #compare td.best { color:var(--pos); font-weight:600; } #compare td.k { color:var(--ink2); white-space:nowrap; }
#compare tr.sec td { border-bottom:none; padding-top:9px; font-weight:600; }
</style>
<script src="linedrag.js"></script>
<script src="marks.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP" crossorigin="anonymous"></script>
</head>
<body>
<main>
  <div class="top">
    <h1>Recipe live sheet</h1>
    <span id="when" class="dim"></span>
    <span id="fresh" class="dim"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="cond"></div>
  <div class="card" id="compare"></div>
  <div class="grid">
    <div>
      <div class="card" id="chartcard">
        <div class="row" style="margin-top:0">
          <span class="tabs" id="tfs"></span>
          <button id="full" title="full screen (F)">⛶ full screen</button>
          <span class="tabs" id="fstabs"></span>
          <button id="notetool" title="write on the chart (N): click where the note belongs">✎ write on chart</button>
          <button id="refresh" title="reload the chart with the newest candles (Alt+R)">↻ refresh</button>
          <button id="resetmarks" title="remove everything I drew or wrote on this index's chart (Claude's marks stay)">Reset my marks</button>
          <button id="savenotes" class="primary" title="send my marks and notes for this index">Save marks + notes</button>
          <label title="the 1h entry areas near price: breaker, order block, FVG, OTE"><input type="checkbox" id="areason" checked> entry areas</label>
          <label id="ovwrap" style="display:none"><input type="checkbox" id="ovon" checked> Claude's marks</label>
          <span id="marksn" class="dim"></span>
          <span id="fsinfo" class="dim num"></span>
          <span class="dim" id="legend">Prices are the CFD's (not the futures'). Dotted = session levels · purple = the higher-timeframe area · blue / red / green = entry / stop / TP1 of the selected plan. Pick a type below, then click or drag on the chart.</span>
        </div>
        <div id="palette"></div>
        <div id="chart"></div>
      </div>
    </div>
    <div>
      <div class="card" id="read"></div>
      <div id="plans"></div>
      <div class="card" id="blocked"></div>
      <div class="card" id="cread" style="display:none"></div>
      <div class="card" id="areas"></div>
      <div class="card" id="breaks"></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const st = { doc: null, asset: null, tf: "15m", answers: {}, sel: null, sig: "", dirty: false, lines: [], marks: {}, notes: {}, noteTool: false, editing: null };
// my marks: per index, kept as a draft in this browser for the day and sent with every save
const mkKey = () => "live-marks-" + (st.doc ? st.doc.day : "");
const myMarks = () => (st.marks[st.asset] ||= []);
function loadMarks() { try { st.marks = JSON.parse(localStorage.getItem(mkKey()) || "{}"); } catch (e) { st.marks = {}; }
  try { st.notes = JSON.parse(localStorage.getItem(mkKey() + "-notes") || "{}"); } catch (e) { st.notes = {}; }
  let wiped = {}; try { wiped = JSON.parse(localStorage.getItem(mkKey() + "-reset") || "{}"); } catch (e) {}   // a reset chart stays empty on reload
  for (const a of Object.values(st.answers)) if (a.notes && a.asset && !wiped[a.asset] && a.day === st.doc.day && !(st.notes[a.asset] || []).length) st.notes[a.asset] = a.notes;
  for (const a of Object.values(st.answers)) if (a.marks && a.asset && !wiped[a.asset] && a.day === st.doc.day && !(st.marks[a.asset] || []).length) st.marks[a.asset] = a.marks; }
// reset: my own marks and notes for this index go (earlier saves stay on file); Claude's overlay is not touched
function resetMarks() {
  const n = myMarks().length + myNotes().length;
  if (!n || !confirm(`Remove your ${myMarks().length} marks and ${myNotes().length} notes from the ${st.asset} chart? Claude's marks stay, and what you already saved stays on file.`)) return;
  st.marks[st.asset] = []; st.notes[st.asset] = []; st.sel = null;
  try { const w = JSON.parse(localStorage.getItem(mkKey() + "-reset") || "{}"); w[st.asset] = true; localStorage.setItem(mkKey() + "-reset", JSON.stringify(w)); } catch (e) {}
  drawChart(false); placeNotes();
}
// my notes: free writing pinned to a time and price ("what you missed"); same draft + save path as the marks
const myNotes = () => (st.notes[st.asset] ||= []);
function keepMarks() { try { localStorage.setItem(mkKey(), JSON.stringify(st.marks)); localStorage.setItem(mkKey() + "-notes", JSON.stringify(st.notes)); } catch (e) {}
  const id = st.doc ? `${st.doc.day}-${st.asset}-notes` : "", sv = st.answers[id];
  const same = sv && JSON.stringify([sv.marks || [], sv.notes || []]) === JSON.stringify([myMarks(), myNotes()]);
  $("marksn").textContent = `${myMarks().length} marks · ${myNotes().length} notes` + (!(myMarks().length + myNotes().length) ? "" : same ? " · saved ✓" : " · not saved yet"); }

const chart = LightweightCharts.createChart($("chart"), { autoSize: true,
  layout: { background: { color: "transparent" }, textColor: css("--ink2") },
  grid: { vertLines: { color: css("--line") }, horzLines: { color: css("--line") } },
  timeScale: { timeVisible: true, secondsVisible: false, borderColor: css("--line") }, rightPriceScale: { borderColor: css("--line") } });
const series = chart.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"), borderVisible: false,
  wickUpColor: css("--up"), wickDownColor: css("--down") });

const layer = marksLayer(chart, series, $("chart"), {
  list: () => st.doc ? myMarks() : [], times: () => st.doc ? (st.doc.assets[st.asset].candles[st.tf] || []).map(c => c.time) : [],
  nowT: () => null, paletteEl: $("palette"), color: css, tfName: () => st.tf, changed: keepMarks,
  under: () => !st.doc ? [] : [
    ...(!$("areason").checked ? [] : (st.doc.assets[st.asset].areas || []).map(a => ({ t0: a.t0, top: a.top, bottom: a.bottom,
      color: css(a.side === "buy" ? "--pos" : "--neg"), alpha: weak(a) ? .04 : a.inside ? .16 : .09, label: `1h ${a.kind} · ${a.side}${weak(a) ? " · wick" : ""}` }))),
    // Claude's marks: drawn like the palette's marks (zones and levels, a short name only); his words are in the card, never on the chart
    ...(!(st.overlay && $("ovon").checked && st.overlay[st.asset]) ? [] : (st.overlay[st.asset].marks || []).map(m => ({ ...m, bold: true,
      color: "#22d3ee", label: "C · " + m.kind + (m.side === "buyside" ? " ↑" : m.side === "sellside" ? " ↓" : "") }))) ] });
const weak = a => (a.kind === "breaker" || a.kind === "order block") && a.body_pct != null && a.body_pct < 50;      // "more wick than body: not a nice breaker"
const fsOn = () => document.fullscreenElement === $("chartcard") || $("chartcard").classList.contains("full");
function toggleFull() {
  const c = $("chartcard");
  if (document.fullscreenElement) document.exitFullscreen();
  else if (c.classList.contains("full")) c.classList.remove("full");
  else if (c.requestFullscreen) c.requestFullscreen().catch(() => c.classList.add("full"));
  else c.classList.add("full");
  setTimeout(() => { $("full").textContent = fsOn() ? "✕ exit full screen" : "⛶ full screen"; renderTabs(); }, 150);
}
$("full").onclick = toggleFull;

// ---- writing on the chart
const notesEl = document.createElement("div"); notesEl.id = "notes"; $("chart").appendChild(notesEl);
const ed = document.createElement("div"); ed.id = "noteedit";
ed.innerHTML = `<textarea placeholder="What I see here / what was missed"></textarea><div class="row"><button class="primary" data-ok>Keep</button><button data-del>Delete</button><button data-x>Cancel</button><span class="muted">Ctrl+Enter keeps</span></div>`;
$("chart").appendChild(ed);
const barTimes = () => st.doc ? (st.doc.assets[st.asset].candles[st.tf] || []).map(c => c.time) : [];
function snap(t) { const a = barTimes(); if (!a.length) return null; let lo = 0, hi = a.length - 1;
  if (t <= a[0]) return a[0]; if (t >= a[hi]) return a[hi];
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (a[m] <= t) lo = m; else hi = m; } return a[lo]; }
function placeNotes() {
  const mine = st.doc ? myNotes() : [];
  const ov = st.doc && st.overlay && $("ovon").checked && st.overlay[st.asset] ? (st.overlay[st.asset].notes || []).map((n, i) => ({ ...n, uid: "claude-" + i, claude: true })) : [];
  const list = mine.concat(ov);
  if (notesEl.children.length !== list.length) notesEl.innerHTML = list.map(n => `<div class="cnote" data-u="${n.uid}"></div>`).join("");
  list.forEach((n, i) => { notesEl.children[i].classList.toggle("claude", !!n.claude); const el = notesEl.children[i], t = snap(n.t), x = t == null ? null : chart.timeScale().timeToCoordinate(t), y = series.priceToCoordinate(n.price);
    el.dataset.u = n.uid; if (el.textContent !== n.text) el.textContent = n.text;
    el.style.display = x == null || y == null ? "none" : ""; if (x != null && y != null) { el.style.left = x + "px"; el.style.top = y + "px"; } });
  requestAnimationFrame(placeNotes);
}
requestAnimationFrame(placeNotes);
function setNoteTool(on) { st.noteTool = on; $("notetool").classList.toggle("on", on); $("chart").style.cursor = on ? "crosshair" : ""; if (on) layer.setPlace(null); }
function openEditor(note, x, y, isNew) {
  st.editing = { note, isNew }; const r = $("chart").getBoundingClientRect();
  ed.style.display = "block"; ed.style.left = Math.max(4, Math.min(x, r.width - 280)) + "px"; ed.style.top = Math.max(4, Math.min(y, r.height - 130)) + "px";
  const ta = ed.querySelector("textarea"); ta.value = note.text || ""; ed.querySelector("[data-del]").style.display = isNew ? "none" : ""; setTimeout(() => ta.focus(), 0);
}
function closeEditor(keep, del) {
  const e = st.editing; if (!e) return; const txt = ed.querySelector("textarea").value.trim(), list = myNotes(), i = list.indexOf(e.note);
  if (del || (keep && !txt)) { if (i >= 0) list.splice(i, 1); }
  else if (keep) { e.note.text = txt; if (i < 0) list.push(e.note); }
  st.editing = null; ed.style.display = "none"; keepMarks();
}
ed.querySelector("[data-ok]").onclick = () => closeEditor(true); ed.querySelector("[data-x]").onclick = () => closeEditor(false);
ed.querySelector("[data-del]").onclick = () => closeEditor(false, true);
ed.querySelector("textarea").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) closeEditor(true); else if (e.key === "Escape") closeEditor(false); e.stopPropagation(); });
ed.addEventListener("mousedown", e => e.stopPropagation()); ed.addEventListener("pointerdown", e => e.stopPropagation());
$("notetool").onclick = () => setNoteTool(!st.noteTool);
$("ovon").onchange = () => drawChart(false);
chart.subscribeClick(p => {
  if (!st.noteTool || !p.point) return;
  const a = barTimes(), t = p.time != null ? p.time : a[a.length - 1], price = series.coordinateToPrice(p.point.y);
  if (t == null || price == null) return;
  setNoteTool(false);
  openEditor({ uid: Math.random().toString(36).slice(2, 8), t, price: Math.round(price * 100) / 100, tf: st.tf, text: "" }, p.point.x, p.point.y, true);
});
notesEl.addEventListener("click", e => { const el = e.target.closest(".cnote"); if (!el) return;
  const n = myNotes().find(x => x.uid === el.dataset.u); if (n) openEditor(n, parseFloat(el.style.left), parseFloat(el.style.top), false); });
notesEl.addEventListener("contextmenu", e => { const el = e.target.closest(".cnote"); if (!el) return; e.preventDefault();
  const l = myNotes(), i = l.findIndex(x => x.uid === el.dataset.u); if (i >= 0) { l.splice(i, 1); keepMarks(); } });
$("savenotes").onclick = () => save(`${st.doc.day}-${st.asset}-notes`, { kind: "notes", asset: st.asset, day: st.doc.day, marked_at: st.doc.now });
document.addEventListener("fullscreenchange", () => { $("full").textContent = fsOn() ? "✕ exit full screen" : "⛶ full screen"; renderTabs(); });
document.addEventListener("keydown", e => { if (e.altKey && e.key.toLowerCase() === "r") { e.preventDefault(); refreshChart(); return; }
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || e.ctrlKey || e.metaKey) return;
  if (e.key.toLowerCase() === "f") toggleFull(); else if (e.key.toLowerCase() === "n") setNoteTool(!st.noteTool); else if (e.key === "Escape") setNoteTool(false); });

function line(price, color, title, style) {
  st.lines.push(series.createPriceLine({ price, color, lineWidth: 1, lineStyle: style ?? 0, axisLabelVisible: true, title }));
}
function drawChart(fit) {
  const a = st.doc.assets[st.asset];
  series.setData(a.candles[st.tf] || []);
  st.lines.forEach(l => series.removePriceLine(l)); st.lines = [];
  for (const [k, v] of Object.entries(a.levels || {})) line(v, css("--ink2"), k.replace(/_/g, " "), 1);
  const s = (a.setups || []).find(x => x.id === st.sel);
  const b = (a.breaks || []).find(x => x.id === st.sel);
  if (b) { line(b.far, css("--neg"), "range end · stop"); line(b.ote_hi, css("--area"), "79%", 2); line(b.entry, css("--accent"), "62% · entry");
    line(b.eq, css("--ink2"), "50%", 2); line(b.near, css("--pos"), "range " + (b.side === "short" ? "low" : "high") + " · TP1"); }
  if (s) {
    const poi = s.evidence && s.evidence.poi;
    if (poi && poi.top != null) { line(poi.top, css("--area"), `${poi.tf} ${poi.kind} top`, 2); line(poi.bottom, css("--area"), `${poi.tf} ${poi.kind} bottom`, 2); }
    if (s.plan) { line(s.plan.entry, css("--accent"), "entry"); line(s.plan.stop, css("--neg"), "stop"); line(s.plan.tp1, css("--pos"), "TP1 " + (s.plan.tp1_name || "")); }
  }
  const ov = st.overlay && $("ovon").checked ? st.overlay[st.asset] : null;      // Claude's read-only marks (out/live/overlay.json)
  if (ov) for (const l of ov.levels || []) line(l.price, css(l.color || "--warn"), l.title, l.style ?? 2);
  if (fit) {
    const n = (a.candles[st.tf] || []).length, show = { "5m": 150, "15m": 110, "1h": 120 }[st.tf];
    chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - show), to: n + 6 });
  }
  layer.redraw(); keepMarks();
  $("fsinfo").textContent = `${st.asset} · ${a.last} at ${a.last_bar} NY`;
}

function renderTabs() {
  $("tabs").innerHTML = Object.entries(st.doc.assets).map(([k, v]) => {
    const live = (v.setups || []).filter(s => s.ok).length;
    return `<button data-a="${k}" class="${k === st.asset ? "on" : ""}">${k}${live ? ` · ${live} plan${live > 1 ? "s" : ""}` : ""}</button>`; }).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { st.asset = b.dataset.a; st.sel = null; st.sig = ""; st.dirty = false; render(true); });
  $("fstabs").innerHTML = fsOn() ? Object.keys(st.doc.assets).map(k => `<button data-a="${k}" class="${k === st.asset ? "on" : ""}">${k}</button>`).join("") : "";
  $("fstabs").querySelectorAll("button").forEach(b => b.onclick = () => { st.asset = b.dataset.a; st.sel = null; st.sig = ""; st.dirty = false; render(true); });
  $("tfs").innerHTML = ["5m", "15m", "1h"].map(t => `<button data-t="${t}" class="${t === st.tf ? "on" : ""}">${t}</button>`).join("");
  $("tfs").querySelectorAll("button").forEach(b => b.onclick = () => { st.tf = b.dataset.t; renderTabs(); drawChart(true); });
}

function renderCond() {
  const a = st.doc.assets[st.asset], c = a.conditions;
  if (!c) { $("cond").innerHTML = `<span class="verdict no">No read for ${st.asset}</span> <span class="dim">${esc(a.error || "")}</span>`; return; }
  const why = [c.vol === "high" ? "high volatility" : null, c.news_day ? "high-impact news today" : null].filter(Boolean).join(" and ");
  const news = c.news.length ? c.news.map(n => `<span class="chip ${n.impact === "high" ? "good" : ""}">${n.time} ${esc(n.name)}</span>`).join("") : `<span class="chip">no scheduled US release</span>`;
  $("cond").innerHTML = `<span class="verdict ${c.recipe_day ? "yes" : "no"}">${c.recipe_day ? "Recipe day: " + why : "Not a recipe day: normal or low volatility and no high-impact news"}</span>
    <span class="dim"> · on record the recipe made money only on volatile or news days (found after the fact; the forward log is testing it)</span>
    <div class="chips"><span class="chip">volatility ${c.vol}</span><span class="chip">${c.state}</span><span class="chip">backdrop ${c.backdrop}</span>
    <span class="chip ${c.monday ? "warn" : ""}">${c.weekday}${c.monday ? " (Mondays lost on record)" : ""}</span>
    <span class="chip ${c.session !== "normal" ? "warn" : ""}">session: ${c.session}</span>${news}
    <span class="chip">last ${a.last} at ${a.last_bar}</span></div>`;
}

function renderCompare() {
  const A = st.doc.assets, names = Object.keys(A), v = names.map(n => A[n]);
  if (!v.some(x => x.strength)) { $("compare").innerHTML = ""; return; }
  const best = (vals, pick) => { const ok = vals.map((x, i) => [x, i]).filter(([x]) => x != null && !Number.isNaN(x)); if (ok.length < 2) return -1;
    const b = ok.reduce((p, c) => pick(c[0], p[0]) ? c : p); return ok.filter(([x]) => x === b[0]).length === 1 ? b[1] : -1; };
  const row = (label, cells, bi = -1) => `<tr><td class="k">${label}</td>${cells.map((c, i) => `<td class="${i === bi ? "best" : ""}">${c ?? "–"}</td>`).join("")}</tr>`;
  const sec = t => `<tr class="sec"><td colspan="${names.length + 1}">${t}</td></tr>`;
  const sg = x => x == null ? null : (x > 0 ? "+" : "") + x;
  const mv = v.map(x => x.strength ? x.strength.session_move_adr : null), pos = v.map(x => x.strength ? x.strength.prev_range_pos : null);
  const g = v.map(x => x.gap || null), open = g.map(x => x && !x.closed);
  const lb = v.map(x => (x.breaks || [])[0] || null);
  let h = `<h2>The three side by side <span class="dim" style="font-weight:400">· green = the weakest (for a sell), the cleanest pool, the hardest push</span></h2><div class="scroll"><table>
    <tr><th></th>${names.map(n => `<th>${n}</th>`).join("")}</tr>` + sec("Strength") +
    row("move since the 18:00 open", mv.map(x => x == null ? null : sg(x) + " ADR"), best(mv, (a, b) => a < b)) +
    row("place in yesterday's range", pos.map(x => x == null ? null : x + "%"), best(pos, (a, b) => a < b)) +
    sec("Opening gap") +
    row("size · side", g.map(x => x ? `${x.size_adr} ADR${x.weekend ? " (weekend)" : ""} · ${x.side}` : null)) +
    row("state", g.map(x => x ? `${esc(x.state)}${x.closed ? "" : ` · ${x.reached_pct}% reached`}` : null)) +
    row("pool on the other side", g.map((x, i) => x && x.pool && open[i] ? `${x.pool.count} ${x.pool.equal ? "equal" : "single"} at ${x.pool.level}${x.pool.count > 1 ? ` (within ${(x.pool.spread_adr * 100).toFixed(1)}% ADR)` : ""}` : null),
        best(g.map((x, i) => x && x.pool && open[i] ? x.pool.count : null), (a, b) => a > b)) +
    row("sweep", g.map(x => x && x.sweep ? `${x.sweep.at} · ${x.sweep.depth_adr} ADR deep` : null)) +
    row("push back", g.map(x => x && x.push ? `${x.push.at} · ${x.push.range_adr} ADR · closed at ${x.push.close_pct}%` : null), best(g.map(x => x && x.push ? x.push.close_pct : null), (a, b) => a > b)) +
    sec("Latest 1h structure break") +
    row("side · when", lb.map(b => b ? `${b.side} · ${b.at} · ${b.kind.toUpperCase()}` : null)) +
    row("range", lb.map(b => b && b.range_adr != null ? `${b.range_adr} ADR` : null), best(lb.map(b => b ? b.range_adr : null), (a, b) => a > b)) +
    row("retraced now", lb.map(b => b && b.retrace_pct != null ? `${b.retrace_pct}% (OTE from 62%)` : null)) + `</table></div>
    <div class="dim" style="font-size:12.5px;margin-top:4px">For a reversal take the cleanest pool; for a continuation the weakest index (your notes, 16 Nov). A weekend gap is shown the same way here; your NWOG reading on regular-hours charts is not built yet.</div>`;
  $("compare").innerHTML = h;
}

// the 1h entry areas near price. They are places to get in, not trades: the idea and the target come first.
function renderAreas() {
  const a = st.doc.assets[st.asset], L = a.areas || [];
  const row = x => `<tr style="${weak(x) ? "opacity:.55" : ""}"><td><b style="color:${css(x.side === "buy" ? "--pos" : "--neg")}">${x.side}</b> · ${esc(x.kind)}</td>
    <td class="num">${x.bottom}–${x.top}</td><td>${esc(x.from)}</td>
    <td>${x.inside ? "<b>price is in it</b>" : `${x.where}, ${x.dist_adr} ADR`}${x.touched && !x.inside ? " · touched" : x.inside ? "" : " · fresh"}</td>
    <td>${x.body_pct != null ? (weak(x) ? `more wick than body (${x.body_pct}%)` : `clean body (${x.body_pct}%)`) : ""}${x.kind === "order block" ? (x.displaced ? " · left a gap" : " · no gap left") : ""}</td></tr>`;
  $("areas").innerHTML = `<h2>Entry areas near price · 1h · ${esc(st.asset)}</h2>
    <div class="dim">Places to get in once the idea and the target are there; an area alone is not a trade. Buy areas sit under price, sell areas over it. Breaker and order block = the body of the last candle only.</div>` +
    (L.length ? `<table style="width:100%;margin-top:6px"><tr class="dim"><td>area</td><td>prices</td><td>from</td><td>where</td><td>quality</td></tr>${L.map(row).join("")}</table>`
              : `<div class="dim" style="margin-top:6px">none within one average day's range</div>`);
}
function renderClaude() {                                   // Claude's read in words: beside the chart, not on it
  const ov = st.overlay && st.overlay[st.asset], L = ov && ov.read || [];
  $("cread").style.display = L.length ? "" : "none";
  if (L.length) $("cread").innerHTML = `<h2>Claude's read · ${esc(st.asset)}${st.overlay.at ? ` <span class="dim">· ${esc(st.overlay.at)}</span>` : ""}</h2>
    <div class="dim">His marks on the chart start with "C ·". Tell him what is missing or wrong.</div><ul style="margin:6px 0 0 18px;padding:0">${L.map(x => `<li style="margin:4px 0">${esc(x)}</li>`).join("")}</ul>`;
}
function saveBtn(id) { return `<button class="primary" data-save="${id}">Save</button> <span class="saved" id="ok-${id}">${st.answers[id] ? "saved ✓" : ""}</span>`; }
function choice(name, opts, cur) { return opts.map(([v, l]) => `<label><input type="radio" name="${name}" value="${v}" ${cur === v ? "checked" : ""}> ${l}</label>`).join(" "); }

function renderRead() {
  const id = `${st.doc.day}-${st.asset}-read`, a = st.answers[id] || {};
  $("read").innerHTML = `<h2>My read for ${st.asset} today</h2>
    <div class="row">${choice("read", [["long", "look for longs"], ["short", "look for shorts"], ["both", "either side"], ["none", "stand aside"]], a.read)}</div>
    <textarea data-note placeholder="Why (areas, liquidity, what I'm waiting for)">${esc(a.note)}</textarea>
    <div class="row">${saveBtn(id)}</div>`;
  $("read").querySelector("[data-save]").onclick = () => save(id, { kind: "read", asset: st.asset, day: st.doc.day,
    read: ($("read").querySelector("input[name=read]:checked") || {}).value || null, note: $("read").querySelector("[data-note]").value });
}

function renderPlans() {
  const a = st.doc.assets[st.asset], live = (a.setups || []).filter(s => s.ok), rest = (a.setups || []).filter(s => !s.ok);
  $("plans").innerHTML = live.length ? live.map(s => {
    const p = s.plan, ans = st.answers[s.id] || {}, poi = s.evidence.poi || {};
    const res = !st.answers[s.id] ? `<div class="res dim">The engine's fill and result show after you save your mark.</div>`
      : `<div class="res">Engine: <b>${esc(s.result ? s.result.state : "—")}</b>${s.result && s.result.filled ? ` · filled ${s.result.filled}` : ""}${s.result && s.result.r != null ? ` · <span class="num">${s.result.r > 0 ? "+" : ""}${s.result.r} R</span>${s.result.state === "open" ? " so far" : ""}` : ""}</div>`;
    return `<div class="card plan ${s.side} ${s.id === st.sel ? "sel" : ""}" data-id="${s.id}">
      <h2>${s.side.toUpperCase()} · decided ${s.decided} <button data-show="${s.id}" style="float:right">show on chart</button></h2>
      <div class="kv num"><span class="dim">entry (limit)</span><span>${p.entry}</span><span class="dim">stop</span><span>${p.stop} (risk ${p.risk})</span>
        <span class="dim">TP1</span><span>${p.tp1} · ${esc(p.tp1_name)} · ${p.rr} R</span><span class="dim">final</span><span>${p.final} · ${esc(p.final_name)}</span>
        <span class="dim">area</span><span>${esc(poi.tf)} ${esc(poi.kind)} ${poi.bottom}–${poi.top}</span><span class="dim">order live</span><span>${p.placed} → ${p.expires}</span></div>
      <div class="row">${choice("mark-" + s.id, [["take", "I'd take it"], ["skip", "skip"], ["other", "other side"], ["mine", "my own entry"]], ans.mark)}</div>
      <div class="row"><input class="px num" data-my="entry" placeholder="my entry" value="${esc(ans.my_entry)}"><input class="px num" data-my="stop" placeholder="my stop" value="${esc(ans.my_stop)}"><input class="px num" data-my="tp" placeholder="my target" value="${esc(ans.my_tp)}"></div>
      <textarea data-note placeholder="Why">${esc(ans.note)}</textarea>
      <div class="row">${saveBtn(s.id)}</div>${res}
      <details><summary>gate trace</summary>${s.gates.map(g => `<div class="gate ${g.passed ? "" : "f"}">${g.passed ? "✓" : "✗"} ${esc(g.name)}: ${esc(g.detail)}</div>`).join("")}</details></div>`; }).join("")
    : `<div class="card dim">No plan from the recipe yet on ${st.asset}. It needs a fresh 1h/4h gap reached to its 50%, then a 15m gap in its direction, in the New York morning.</div>`;
  $("plans").querySelectorAll("[data-show]").forEach(b => b.onclick = () => { st.sel = b.dataset.show; $("plans").querySelectorAll(".plan").forEach(c => c.classList.toggle("sel", c.dataset.id === st.sel)); drawChart(false); });
  $("plans").querySelectorAll(".plan").forEach(c => {
    const s = live.find(x => x.id === c.dataset.id);
    c.querySelector("[data-save]").onclick = () => save(s.id, { kind: "plan", asset: st.asset, day: st.doc.day, side: s.side, decided: s.decided, engine_plan: s.plan,
      marked_at: st.doc.now, mark: (c.querySelector(`input[name="mark-${s.id}"]:checked`) || {}).value || null,
      my_entry: c.querySelector('[data-my=entry]').value, my_stop: c.querySelector('[data-my=stop]').value, my_tp: c.querySelector('[data-my=tp]').value,
      note: c.querySelector("[data-note]").value, recipe_day: (st.doc.assets[st.asset].conditions || {}).recipe_day });
  });
  $("blocked").innerHTML = `<h2>Looked at and not taken by the recipe <span class="dim">(${rest.length})</span></h2>` + (rest.length ? rest.map(s => {
    const f = s.gates.filter(g => !g.passed);
    return `<details><summary>${s.side} · ${s.decided} · stopped at: ${esc(f.map(g => g.name).join(", ") || "no plan")}</summary>${f.map(g => `<div class="gate f">✗ ${esc(g.name)}: ${esc(g.detail)}</div>`).join("")}
      ${s.evidence.poi ? `<div class="gate">area: ${esc(s.evidence.poi.tf)} ${esc(s.evidence.poi.kind)} ${s.evidence.poi.bottom}–${s.evidence.poi.top} <button data-show="${s.id}">show</button></div>` : ""}</details>`; }).join("") : `<div class="dim">nothing yet</div>`);
  $("blocked").querySelectorAll("[data-show]").forEach(b => b.onclick = () => { st.sel = b.dataset.show; drawChart(false); });
  const br = a.breaks || [];
  $("breaks").innerHTML = `<h2>1h structure breaks → OTE <span class="dim">(${br.length}, last 4 days)</span></h2>
    <div class="dim" style="font-size:13px">Every 1h close through a swing, with its range. Taken mechanically this has no edge on record (5,197 trades, 27% wins, −0.02 R), so your marks on which breaks count are the point.</div>` +
    (br.length ? br.map(b => { const ans = st.answers[b.id] || {};
      return `<details ${b.id === st.sel ? "open" : ""}><summary>${b.side} · ${b.at} · ${b.kind.toUpperCase()}${b.displacement ? " · displacement" : ""}${ans.mark ? " · ✓ " + esc(ans.mark) : ""}</summary>
        <div class="kv num"><span class="dim">range</span><span>${b.far} → ${b.near}</span><span class="dim">OTE</span><span>${b.entry} (62%) – ${b.ote_hi} (79%)</span></div>
        <div class="row"><button data-show="${b.id}">show on chart</button>${choice("bmark-" + b.id, [["valid", "I'd trade this"], ["no", "not this one"], ["watch", "watching"]], ans.mark)}</div>
        <textarea data-note placeholder="Why this break counts, or doesn't">${esc(ans.note)}</textarea>
        <div class="row">${saveBtn(b.id)}</div>
        ${st.answers[b.id] ? `<div class="res">Mechanical version: <b>${esc(b.state)}</b>${b.filled ? ` · filled ${b.filled}` : ""}${b.r != null ? ` · <span class="num">${b.r > 0 ? "+" : ""}${b.r} R</span>` : ""}</div>` : `<div class="res dim">What the mechanical version did shows after you save.</div>`}
      </details>`; }).join("") : `<div class="dim">none in the last 4 days</div>`);
  $("breaks").querySelectorAll("[data-show]").forEach(x => x.onclick = () => { st.sel = x.dataset.show; drawChart(false); });
  $("breaks").querySelectorAll("details").forEach((d, i) => { const b = br[i];
    d.querySelector("[data-save]").onclick = () => save(b.id, { kind: "break", asset: st.asset, day: st.doc.day, side: b.side, break_at: b.at, range: [b.far, b.near], entry: b.entry,
      marked_at: st.doc.now, mark: (d.querySelector(`input[name="bmark-${b.id}"]:checked`) || {}).value || null, note: d.querySelector("[data-note]").value }); });
  document.querySelectorAll("#plans input, #plans textarea, #read input, #read textarea, #breaks input, #breaks textarea").forEach(e => e.addEventListener("input", () => { st.dirty = true; }));
}

async function save(id, body) {
  body.id = id; body.marks = myMarks(); body.notes = myNotes();
  const r = await fetch("api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { alert("save failed"); return; }
  st.answers[id] = JSON.parse(JSON.stringify(body)); st.dirty = false; st.sig = ""; render(false);
}

function render(fit) {
  const d = st.doc;
  $("when").textContent = `${d.mode === "replay" ? "REPLAY · " : ""}New York ${d.now}`;
  renderTabs(); renderCond(); renderCompare(); renderAreas(); renderClaude();
  const a = d.assets[st.asset];
  const sig = st.asset + JSON.stringify((a.breaks || []).map(b => [b.id, b.state, b.near])) + JSON.stringify((a.setups || []).map(s => [s.id, s.ok, s.result])) + Object.keys(st.answers).length;
  if (sig !== st.sig && !st.dirty) { st.sig = sig; renderRead(); renderPlans(); }
  drawChart(fit);
}

async function poll(first) {
  try {
    const d = await (await fetch("today.json?t=" + Date.now())).json();
    const fresh = !st.doc || d.now !== st.doc.now;
    st.doc = d;
    if (!st.asset || !d.assets[st.asset]) st.asset = Object.keys(d.assets)[0];
    if (first) loadMarks();
    try { const r = await fetch("overlay.json?t=" + Date.now()); st.overlay = r.ok ? await r.json() : null; } catch (e) { st.overlay = null; }
    $("ovwrap").style.display = st.overlay ? "" : "none";
    $("fresh").textContent = `page checked ${new Date().toLocaleTimeString()}`;
    if (first || fresh) render(first);
  } catch (e) { $("fresh").textContent = "waiting for today.json (is live_recipe.py running?)"; }
}
async function refreshChart() { $("refresh").textContent = "↻ …"; await poll(false); if (st.doc) render(true); $("refresh").textContent = "↻ refresh"; }
$("areason").onchange = () => drawChart(false); $("refresh").onclick = refreshChart; $("resetmarks").onclick = resetMarks;
(async () => {
  try { st.answers = await (await fetch("api/answers")).json(); } catch (e) { st.answers = {}; }
  await poll(true);
  setInterval(() => poll(false), 20000);
})();
</script>
</body>
</html>
