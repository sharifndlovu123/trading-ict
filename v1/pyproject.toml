[project]
name = "ict-engine"
version = "0.0.1"
description = "ICT model engine: opens/closes simulated trades per model and ranks models by expectancy"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "databento>=0.90.0",
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ict_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
