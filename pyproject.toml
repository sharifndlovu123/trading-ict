[project]
name = "ict-v2"
version = "0.2.0"
description = "Sharif's ICT reading, rebuilt clean: concepts with their lessons, tools and tests, and the pipelines that use them"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["v2"]
