<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charts</title>
<style>
/* Laid out like TradingView (Sharif, 18 Nov 2026: "I'm very used to their UI"): symbol and interval along the top,
   drawing tools down the left, a watchlist and details on the right, replay along the bottom. */
:root { --bg:#131722; --panel:#1e222d; --panel2:#2a2e39; --ink:#d1d4dc; --ink2:#787b86; --line:#2a2e39; --grid:#1c2030; --pos:#26a69a; --neg:#ef5350;
  --up:#3987e5; --down:#d95926; --accent:#2962ff; --area:#9c7bea; --bs:#5b9cf6; --ss:#f7936f; --mine:#f2b84b; --claude:#22d3ee; }
@media (prefers-color-scheme: light) { :root { --bg:#ffffff; --panel:#ffffff; --panel2:#f0f3fa; --ink:#131722; --ink2:#6a6d78; --line:#e0e3eb; --grid:#f0f3fa; --up:#2a78d6; --down:#eb6834;
  --area:#7e57c2; --bs:#1e53e5; --ss:#d1512d; --mine:#b77400; --claude:#0e8fa3; } }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--line); color:var(--ink); font:13px/1.4 -apple-system,"Trebuchet MS",Roboto,"Segoe UI",sans-serif; display:flex; flex-direction:column; gap:1px; overflow:hidden; }
button, select, input { font:inherit; color:var(--ink); }
.dim { color:var(--ink2); } .num { font-variant-numeric:tabular-nums; } .up { color:var(--pos); } .dn { color:var(--neg); }
/* top bar */
#top { background:var(--panel); height:40px; display:flex; align-items:center; padding:0 6px; gap:2px; white-space:nowrap; overflow-x:auto; overflow-y:hidden; flex:none; }
#top .sep { width:1px; height:22px; background:var(--line); margin:0 5px; flex:none; }
#top .sp { flex:1; }
/* which session is running: always in sight */
#modebar { height:4px; flex:none; background:var(--panel); } body.learn #modebar { background:#2962ff; } body.hunt #modebar { background:#e8590c; }
#mode { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; height:28px; flex:none; }
#mode button { background:none; border:0; padding:0 12px; cursor:pointer; font-weight:800; letter-spacing:.06em; color:var(--ink2); }
#mode button:hover { background:var(--panel2); }
body.learn #mode [data-m="learn"] { background:#2962ff; color:#fff; } body.hunt #mode [data-m="hunt"] { background:#e8590c; color:#fff; }
body:not(.learn):not(.hunt) #mode [data-m=""] { background:var(--panel2); color:var(--ink); }
#modewho { margin-left:6px; }
.tb { background:none; border:0; border-radius:6px; padding:5px 8px; cursor:pointer; height:30px; display:inline-flex; align-items:center; gap:5px; }
.tb:hover { background:var(--panel2); } .tb.on { color:var(--accent); } .tb.act { background:var(--accent); color:#fff; }
#sym { font-weight:700; font-size:14px; background:none; border:0; border-radius:6px; padding:5px 4px; cursor:pointer; height:30px; }
#sym:hover { background:var(--panel2); } #sym option { background:var(--panel); color:var(--ink); }
/* middle */
#mid { flex:1; min-height:0; display:flex; gap:1px; }
#tools { background:var(--panel); width:46px; flex:none; display:flex; flex-direction:column; align-items:center; padding:6px 0; gap:2px; position:relative; }
#tools .tl { width:34px; height:34px; border:0; border-radius:6px; background:none; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
#tools .tl:hover { background:var(--panel2); } #tools .tl.on { color:var(--accent); background:var(--panel2); }
#tools .gap { flex:1; } #tools .ln { width:26px; height:1px; background:var(--line); margin:4px 0; }
#fly { position:absolute; left:50px; z-index:30; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px; min-width:190px; box-shadow:0 8px 28px rgba(0,0,0,.45); display:none; }
#fly h4 { margin:2px 8px 4px; font-size:11px; font-weight:600; color:var(--ink2); text-transform:uppercase; letter-spacing:.04em; }
#fly .it { display:flex; gap:8px; align-items:center; padding:6px 8px; border-radius:5px; cursor:pointer; } #fly .it:hover { background:var(--panel2); } #fly .it.on { color:var(--accent); }
#fly .it .k { margin-left:auto; color:var(--ink2); font-size:11px; }
#grid { flex:1; min-width:0; display:grid; gap:1px; background:var(--line); }
#side { width:300px; flex:none; background:var(--panel); overflow:auto; display:none; }
#side.on { display:flex; flex-direction:column; }
#tabs { display:flex; border-bottom:1px solid var(--line); flex:none; }
#tabs button { flex:1; background:none; border:0; border-bottom:2px solid transparent; padding:9px 4px; cursor:pointer; color:var(--ink2); font-weight:600; }
#tabs button:hover { color:var(--ink); } #tabs button.on { color:var(--ink); border-bottom-color:var(--accent); }
.tab { display:none; flex:1; min-height:0; overflow:auto; } .tab.on { display:block; }
#tab-notes.on { display:flex; flex-direction:column; padding:10px 12px; gap:8px; overflow:auto; }
#notekind b.learn { color:#5b8cff; } #notekind b.hunt { color:#ff8a4c; }
#notetext { width:100%; height:450px; min-height:150px; max-height:80vh; flex:none; resize:vertical; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; line-height:1.45; }
#noteadd { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px; cursor:pointer; font-weight:600; }
#notelist { flex:none; margin:0 -12px; }
.nrow { padding:8px 12px; border-top:1px solid var(--line); white-space:pre-wrap; } .nrow .m { display:flex; gap:6px; align-items:center; margin-bottom:3px; font-size:11px; color:var(--ink2); }
.nrow .k { border-radius:4px; padding:0 6px; font-weight:700; color:#fff; } .nrow .k.learn { background:#2962ff; } .nrow .k.hunt { background:#c2410c; }
.nrow .x { margin-left:auto; background:none; border:0; color:var(--ink2); cursor:pointer; } .nrow .x:hover { color:var(--neg); }
#side h3 { margin:0; padding:10px 12px 6px; font-size:12px; font-weight:600; color:var(--ink2); text-transform:uppercase; letter-spacing:.04em; }
#watch .w { display:flex; gap:8px; padding:6px 12px; cursor:pointer; border-left:2px solid transparent; } #watch .w:hover { background:var(--panel2); }
#watch .w.on { border-left-color:var(--accent); background:var(--panel2); } #watch .w b { flex:1; font-weight:600; }
#read { padding:0 12px 12px; } #read ul { margin:0; padding-left:18px; } #read li { margin-bottom:6px; }
@media (max-width: 900px) { #side { position:absolute; right:0; top:41px; bottom:35px; z-index:20; border-left:1px solid var(--line); } }
/* a chart */
.pane { background:var(--bg); display:flex; flex-direction:column; min-width:0; min-height:140px; position:relative; }
.pane.active { box-shadow:inset 0 0 0 1px var(--accent); }
.pane .c { flex:1; min-height:0; position:relative; }
.legend { position:absolute; left:8px; top:6px; z-index:5; display:flex; gap:8px; align-items:baseline; pointer-events:none; white-space:nowrap; max-width:calc(100% - 90px); overflow:hidden; }
.legend b { font-size:14px; } .legend .tf { color:var(--ink2); }
.pbtn { position:absolute; right:62px; top:4px; z-index:6; display:none; gap:2px; } .pane:hover .pbtn { display:flex; }
.pbtn button { background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:0 7px; height:22px; cursor:pointer; }
.pbtn button:hover { background:var(--panel2); }
/* bottom bar */
#bottom { background:var(--panel); height:34px; flex:none; display:flex; align-items:center; gap:4px; padding:0 8px; white-space:nowrap; overflow-x:auto; overflow-y:hidden; }
#bottom .sp { flex:1; } #replay { display:none; align-items:center; gap:2px; } #replay.on { display:flex; }
#at { background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:2px 6px; height:26px; color-scheme:dark; }
@media (prefers-color-scheme: light) { #at { color-scheme:light; } }
#menu { position:absolute; z-index:30; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px; min-width:210px; box-shadow:0 8px 28px rgba(0,0,0,.45); display:none; }
#menu h4 { margin:4px 8px; font-size:11px; font-weight:600; color:var(--ink2); text-transform:uppercase; letter-spacing:.04em; }
#menu .it { padding:6px 8px; border-radius:5px; cursor:pointer; } #menu .it:hover { background:var(--panel2); }
/* notes written on the chart */
.cnote { position:absolute; z-index:4; transform:translate(6px,-50%); max-width:240px; padding:2px 7px; border-radius:4px; font-size:12px; line-height:1.35;
  background:var(--mine); color:#1b1400; cursor:pointer; white-space:pre-wrap; }
.cnote.claude { background:var(--claude); color:#04252b; cursor:default; }
.noteedit { position:absolute; z-index:8; display:none; width:270px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; box-shadow:0 8px 28px rgba(0,0,0,.45); }
.noteedit textarea { width:100%; min-height:64px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:5px; }
.noteedit .row { display:flex; gap:6px; align-items:center; margin-top:6px; }
.noteedit button { background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:2px 9px; cursor:pointer; }
.sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
</style>
<script src="marks.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-JZigAjwiaZtkUbA44CWkPaT3iBb/mU5pO6QOANp+OqHd4q+1+7MG1kzp2OOP9ZfP" crossorigin="anonymous"></script>
</head>
<body>
<div id="top">
  <span id="mode" title="which session this is. Claude sets it when a learn session or a hunt starts; you can set it too"><button data-m="learn">LEARN</button><button data-m="hunt">HUNT</button><button data-m="" title="no session running">OFF</button></span>
  <span id="modewho" class="dim"></span>
  <span class="sep"></span>
  <select id="sym" title="the instrument of the chart you last touched"></select>
  <span class="sep"></span>
  <span id="tfs" style="display:flex;gap:1px"></span>
  <span class="sep"></span>
  <button class="tb" id="ctype" title="candles or a line of the closes (L); the whole layout: Shift+L"></button>
  <button class="tb" id="layoutbtn" title="how many charts and how they are arranged">▦ Layout</button>
  <button class="tb" id="add" title="one more chart, the same as the one you last touched">＋</button>
  <span class="sep"></span>
  <button class="tb" id="pct" title="one chart: every instrument shown as a line in % change, so strength and divergence show directly">％ Compare</button>
  <label class="tb" title="the crosshair shows the same moment on every chart; charts on the same timeframe also scroll and zoom together"><input type="checkbox" id="sync" checked autocomplete="off"> Sync</label>
  <button class="tb" id="replaybtn" title="take the charts back to a moment: nothing after it is shown">⏮ Replay</button>
  <span class="sp"></span>
  <label class="tb" title="show or hide what Claude drew"><input type="checkbox" id="ovon" checked autocomplete="off"> Claude's marks</label>
  <button class="tb" id="refresh" title="read the candles and the marks again (Shift+R). Alt+R re-centres the charts">↻</button>
  <button class="tb" id="fsbtn" title="the chart you last touched on the whole screen (Shift+F)">⛶</button>
  <button class="tb" id="readbtn" title="the side panel: watchlist, your notes, Claude's read (W)">☰</button>
</div>
<div id="modebar"></div>
<div id="mid">
  <div id="tools"></div>
  <div id="grid"></div>
  <aside id="side">
    <div id="tabs"><button data-tab="watch">Watchlist</button><button data-tab="notes" title="write a note for learning or for a hunt (Shift+N)">Notes</button><button data-tab="read">Claude's read</button></div>
    <div class="tab" id="tab-watch"><div id="watch"></div></div>
    <div class="tab" id="tab-notes">
      <div id="notekind" class="dim"></div>
      <textarea id="notetext" placeholder="Write your note here. It is saved with the instrument, the timeframe and the time the chart was showing."></textarea>
      <button id="noteadd" title="Ctrl+Enter">Save note</button>
      <div id="notectx" class="dim"></div>
      <div id="notelist"></div>
    </div>
    <div class="tab" id="tab-read"><h3 id="readh">Claude's read</h3><div id="read"></div></div>
  </aside>
</div>
<div id="bottom">
  <span id="replay">
    <button class="tb" data-step="-D" title="one day back">⏪</button><button class="tb" data-step="-1" title="one candle back (the chart you last touched)">◀</button>
    <input type="datetime-local" id="at" title="a New York date and time; the charts show nothing after it">
    <button class="tb" data-step="1" title="one candle forward">▶</button><button class="tb" data-step="D" title="one day forward">⏩</button>
    <button class="tb" id="play" title="one candle every second">▶ Play</button>
    <button class="tb" id="now" title="leave replay: back to the newest candles">✕ Exit replay</button>
  </span>
  <span id="when" class="dim"></span>
  <span class="sp"></span>
  <span id="marksn" class="dim"></span>
</div>
<div id="fly"></div><div id="menu"></div>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TFS = ["1m", "5m", "15m", "1h", "4h", "1D", "1W", "1M"];
const TFNAME = { "1m": "1m", "5m": "5m", "15m": "15m", "1h": "1h", "4h": "4h", "1D": "D", "1W": "W", "1M": "M" };
const STEP = { "1m": 60, "5m": 300, "15m": 900, "1h": 3600, "4h": 14400, "1D": 86400, "1W": 604800, "1M": 2592000 };
const SHOW = { "1m": 150, "5m": 150, "15m": 110, "1h": 120, "4h": 120, "1D": 130, "1W": 110, "1M": 90 };
const SETS = { Indices: ["US100", "US500", "US30"], Europe: ["DE40", "UK100"], Metals: ["XAUUSD", "XAGUSD"] };       // charts that are read together
const CLEAR = "rgba(0,0,0,0)";
const COLORS = ["#2962ff", "#ff9800", "#26a69a", "#e91e63", "#9c27b0", "#ffeb3b", "#00bcd4", "#8bc34a", "#795548", "#607d8b"];
// the tools down the left side: [icon, name, the kinds in its fly-out]
const GROUPS = [["╱", "Lines", ["trendline", "displacement", "fake push"]],
                ["—", "Levels", ["buyside", "sellside", "EQH", "EQL", "BOS", "level behind", "level ahead"]],
                ["┆", "Change of bias", ["→ bull", "→ bear"]],
                ["▭", "Imbalances", ["BISI", "SIBI", "IFVG", "VI", "BPR", "gap", "liquidity void", "NWOG", "NDOG"]],
                ["▣", "Blocks", ["order block", "breaker", "mitigation block", "rejection block"]]];
const KIND = {}; for (const [side, shape, kinds] of MARK_PALETTE) for (const k of kinds) KIND[k] = { side, shape, kind: k };
const KEEP = "charts-v2";
const keep = (() => { try { return JSON.parse(localStorage.getItem(KEEP) || "{}"); } catch (e) { return {}; } })();
// cfg = the layout: one entry per chart (its instrument, its timeframe, line or candles), in reading order; cols 0 = automatic
const st = { assets: [], cfg: keep.cfg || null, cols: keep.cols || 0, side: keep.side !== false, pct: false, solo: null, panes: [], active: null,
             marks: {}, notes: {}, claude: {}, cache: new Map(), until: null, newest: null, place: null, noteTool: false, grab: false, replay: false,
             tab: keep.tab || "watch", mode: "", written: [], snap: !!keep.snap,
             lastKind: keep.lastKind || {} };
const save = () => { try { localStorage.setItem(KEEP, JSON.stringify({ cfg: st.cfg, cols: st.cols, side: st.side, lastKind: st.lastKind, tab: st.tab, snap: st.snap })); } catch (e) {} };
function loadMine() { try { st.marks = JSON.parse(localStorage.getItem(KEEP + "-marks") || "{}"); st.notes = JSON.parse(localStorage.getItem(KEEP + "-notes") || "{}"); } catch (e) { st.marks = {}; st.notes = {}; } }
const keepMine = () => { try { localStorage.setItem(KEEP + "-marks", JSON.stringify(st.marks)); localStorage.setItem(KEEP + "-notes", JSON.stringify(st.notes)); } catch (e) {} };
const myMarks = a => (st.marks[a] ||= []), myNotes = a => (st.notes[a] ||= []);
const dp = v => Math.abs(v) < 20 ? 4 : Math.abs(v) < 500 ? 3 : 2;
const wall = t => new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ");
const cur = () => st.active || st.panes.find(p => !p.pct) || null;          // the chart the top bar acts on: the one last touched
const curCfg = () => (cur() && cur().c) || st.cfg[0];

// ---- data
async function getCandles(asset, tf) {
  const k = `${asset}|${tf}|${st.until ?? ""}`;
  if (!st.cache.has(k)) st.cache.set(k, fetch(`api/candles?asset=${asset}&tf=${tf}${st.until != null ? "&until=" + st.until : ""}`).then(r => r.json()));
  const d = await st.cache.get(k);
  if (d.last != null) st.newest = Math.max(st.newest || 0, d.last);
  return d.candles || [];
}
async function getClaude(asset) { try { st.claude[asset] = await (await fetch("api/marks?asset=" + asset)).json(); } catch (e) { st.claude[asset] = { marks: [], read: [] }; } }

// ---- his marks: one set of tools for every chart
function marksChanged() {
  keepMine(); if (st.place) setPlace(null); else tools();  // one placement per pick
  st.panes.forEach(p => p.layer && p.layer.redraw());      // the same instrument may be on two charts
  count("not saved yet");
}
function count(tail) {
  const shown = [...new Set(st.cfg.map(c => c.asset))], n = shown.reduce((s, a) => s + myMarks(a).length + myNotes(a).length, 0);
  $("marksn").textContent = n ? `${n} of mine on these charts · ${tail}` : "";
}
function setPlace(p) { st.place = p; if (p) { st.grab = false; st.noteTool = false; st.lastKind[p.shape] = p.kind; save(); }
  st.panes.forEach(q => { if (q.layer) { q.layer.setGrab(false); q.layer.setPlace(p); } if (q.box && !p) q.box.style.cursor = ""; }); tools(); }
function setGrab(on) { st.grab = on; st.place = null; st.noteTool = false; st.panes.forEach(q => q.layer && (q.layer.setPlace(null), q.layer.setGrab(on))); tools(); }
function setNoteTool(on) { st.noteTool = on; if (on) { st.place = null; st.grab = false; st.panes.forEach(q => q.layer && (q.layer.setPlace(null), q.layer.setGrab(false))); }
  st.panes.forEach(q => q.box && (q.box.style.cursor = on ? "crosshair" : "")); tools(); }
const shownMarks = () => [...new Set(st.cfg.map(c => c.asset))].flatMap(a => myMarks(a));
const allLocked = () => { const m = shownMarks(); return m.length > 0 && m.every(x => x.locked); };
function toggleSnap() { st.snap = !st.snap; save(); tools(); }
function tools() {                                       // the toolbar down the left
  const on = g => st.place && g[2].includes(st.place.kind);
  $("tools").innerHTML = `<button class="tl ${!st.place && !st.grab && !st.noteTool ? "on" : ""}" id="t-cur" title="cursor (Esc)">✛</button>` +
    `<button class="tl ${st.grab ? "on" : ""}" id="t-grab" title="grab (G): the charts hold still; press near any of your marks to move it">✋</button><span class="ln"></span>` +
    GROUPS.map((g, i) => `<button class="tl ${on(g) ? "on" : ""}" data-g="${i}" title="${g[1]}">${g[0]}</button>`).join("") +
    `<button class="tl ${st.noteTool ? "on" : ""}" id="t-note" title="write on the chart (N): click where the note belongs">T</button><span class="ln"></span>` +
    `<button class="tl ${st.snap ? "on" : ""}" id="t-snap" title="snap (M): a point you place or drag jumps to the nearest candle's open, high, low or close">🧲</button>` +
    `<button class="tl ${allLocked() ? "on" : ""}" id="t-lock" title="lock every mark of mine on these charts, or unlock them all. One mark: double-click it to lock, double-click again to unlock">🔒</button>` +
    `<span class="gap"></span><button class="tl" id="t-save" title="save my marks and notes for every chart shown here">💾</button>` +
    `<button class="tl" id="t-clear" title="remove everything I drew on the charts shown here (Claude's marks stay)">🗑</button>`;
  $("t-cur").onclick = () => { setPlace(null); setGrab(false); setNoteTool(false); };
  $("t-grab").onclick = () => setGrab(!st.grab);
  $("t-note").onclick = () => setNoteTool(!st.noteTool);
  $("t-snap").onclick = toggleSnap;
  $("t-lock").onclick = () => { const on = !allLocked(); shownMarks().forEach(m => m.locked = on); keepMine(); st.panes.forEach(p => p.layer && (p.layer.deselect(), p.layer.redraw())); tools(); };
  $("tools").querySelectorAll("[data-g]").forEach(b => b.onclick = e => { e.stopPropagation(); fly(+b.dataset.g, b); });
  $("t-clear").onclick = () => { const as = [...new Set(st.cfg.map(c => c.asset))], n = as.reduce((s, a) => s + myMarks(a).length + myNotes(a).length, 0);
    if (n && confirm(`Remove your ${n} marks and notes from ${as.join(", ")}? Claude's marks stay, and what you already saved stays on file.`)) { as.forEach(a => { st.marks[a] = []; st.notes[a] = []; }); marksChanged(); } };
  $("t-save").onclick = async () => { let n = 0;
    for (const a of [...new Set(st.cfg.map(c => c.asset))]) { if (!myMarks(a).length && !myNotes(a).length) continue;
      const r = await fetch("api/save", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ asset: a, tf: (st.cfg.find(c => c.asset === a) || {}).tf || "", marks: myMarks(a), notes: myNotes(a), chart_time: st.until }) });
      if (!r.ok) { alert("save failed for " + a); return; } n++; }
    count(n ? `saved ✓ (${n} instrument${n === 1 ? "" : "s"})` : "nothing to save"); };
  count("in this browser");
}
function fly(i, btn) {                                   // a tool's fly-out, like the drawing menus
  const f = $("fly"), g = GROUPS[i];
  if (f.style.display === "block" && f.dataset.g == i) { f.style.display = "none"; return; }
  const keys = { trendline: "Alt+T", [st.lastKind.level || "BOS"]: "Alt+H", [st.lastKind.vline || "→ bull"]: "Alt+V" };

$("noteadd").onclick = addNote;
$("notetext").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addNote(); } e.stopPropagation(); });
$("notetext").addEventListener("input", () => { try { localStorage.setItem(KEEP + "-draft", $("notetext").value); } catch (e) {} });     // a draft survives a reload
try { $("notetext").value = localStorage.getItem(KEEP + "-draft") || ""; } catch (e) {}

// ---- the top bar: it acts on the chart last touched
const joinMates = p => setTimeout(() => { const m = st.panes.find(q => q !== p && !q.pct && q.c.tf === p.c.tf && q.times.length);      // a changed chart joins the others on its timeframe
  if (m && $("sync").checked && !p.dead) { const r = m.chart.timeScale().getVisibleLogicalRange(); if (r) p.chart.timeScale().setVisibleLogicalRange({ from: iOf(p.times, tOf(m.times, r.from)), to: iOf(p.times, tOf(m.times, r.to)) }); } }, 120);
async function setAsset(a) { const p = cur(); if (!p || !p.c) return; p.c.asset = a; save(); topbar(); side(); await fillPane(p, true, true); joinMates(p); }
async function setTf(tf) { const p = cur(); if (!p || !p.c) return; p.c.tf = tf; save(); topbar(); await fillPane(p, true); joinMates(p); }
function topbar() {
  const c = curCfg();
  $("sym").innerHTML = st.assets.map(n => `<option ${n === c.asset ? "selected" : ""}>${n}</option>`).join("");
  $("tfs").innerHTML = TFS.map(t => `<button class="tb ${t === c.tf && !st.pct ? "act" : ""}" data-t="${t}" title="${t} (Shift+click: every chart)">${TFNAME[t]}</button>`).join("");
  $("tfs").querySelectorAll("button").forEach(b => b.onclick = e => { if (e.shiftKey || st.pct) { st.cfg.forEach(x => x.tf = b.dataset.t); save(); build(); } else setTf(b.dataset.t); });
  $("ctype").textContent = c.line ? "╱ Line" : "▮ Candles"; $("pct").classList.toggle("on", st.pct);
}
$("sym").onchange = e => setAsset(e.target.value);
$("ctype").onclick = e => { if (e.shiftKey) return allLine(); const p = cur(); if (!p || !p.c) return; p.c.line = !p.c.line; save(); fillPane(p, false); };
const allLine = () => { const on = !st.cfg.every(c => c.line); st.cfg.forEach(c => c.line = on); save(); if (!st.pct) st.panes.forEach(p => fillPane(p, false)); topbar(); };
$("add").onclick = () => { const c = curCfg(); st.cfg.push({ asset: c.asset, tf: c.tf, line: c.line }); st.solo = null; st.pct = false; save(); build(); };
$("layoutbtn").onclick = e => {                           // how many charts, how they are arranged, and ready-made sets
  e.stopPropagation(); const m = $("menu"), r = $("layoutbtn").getBoundingClientRect(), c = curCfg();
  if (m.style.display === "block") { m.style.display = "none"; return; }
  const grids = [["1 chart", 1, 1], ["2 side by side", 2, 2], ["2 stacked", 2, 1], ["3 side by side", 3, 3], ["3 stacked", 3, 1], ["4 in a square", 4, 2], ["6 (3 across)", 6, 3], ["8 (4 across)", 8, 4]];
  const sets = { ...Object.fromEntries(Object.entries(SETS).map(([k, v]) => [k, v.filter(n => st.assets.includes(n))]).filter(([, v]) => v.length).map(([k, v]) => [k, () => v.map(asset => ({ asset, tf: c.tf }))])),
    "All instruments": () => st.assets.map(asset => ({ asset, tf: c.tf })),
    [`${c.asset} · W D 4h`]: () => ["1W", "1D", "4h"].map(tf => ({ asset: c.asset, tf })),
    [`${c.asset} · D 4h 1h`]: () => ["1D", "4h", "1h"].map(tf => ({ asset: c.asset, tf })),
    [`${c.asset} · 1h 15m 5m`]: () => ["1h", "15m", "5m"].map(tf => ({ asset: c.asset, tf })),
    [`${c.asset} · 15m 5m 1m`]: () => ["15m", "5m", "1m"].map(tf => ({ asset: c.asset, tf })) };
  m.innerHTML = "<h4>Layout</h4>" + grids.map(([n], i) => `<div class="it" data-g="${i}">${n}</div>`).join("") + "<h4>Ready-made sets</h4>" + Object.keys(sets).map(k => `<div class="it" data-s="${esc(k)}">${esc(k)}</div>`).join("");
  m.style.display = "block"; m.style.left = r.left + "px"; m.style.top = (r.bottom + 4) + "px";
  m.querySelectorAll("[data-g]").forEach(el => el.onclick = () => { const [, n, cols] = grids[+el.dataset.g];
    while (st.cfg.length < n) st.cfg.push({ ...c }); st.cfg.length = n; st.cols = cols; st.solo = null; st.pct = false; save(); m.style.display = "none"; build(); });
  m.querySelectorAll("[data-s]").forEach(el => el.onclick = () => { st.cfg = sets[el.dataset.s](); st.cols = 0; st.solo = null; st.pct = false; save(); m.style.display = "none"; build(); });
};
$("pct").onclick = () => { st.pct = !st.pct; build(); };
$("readbtn").onclick = () => { st.side = !st.side; save(); side(); };
$("fsbtn").onclick = () => full(cur());
$("ovon").onchange = () => st.panes.forEach(p => p.layer && p.layer.redraw());
$("sync").onchange = () => { if ($("sync").checked && !st.pct) { const seen = new Set(); for (const p of st.active ? [st.active, ...st.panes] : st.panes) if (!seen.has(p.c.tf)) { seen.add(p.c.tf); follow(p); } } };
async function refresh() { st.cache.clear(); st.claude = {}; await fill(true); watch(); }
$("refresh").onclick = refresh;

// ---- replay: take the charts back to a moment
let timer = null;
async function goTo(t) {                                  // t = New York clock time in seconds; null = the newest candles
  if (t != null && st.newest != null && t >= st.newest) t = null;
  st.until = t; st.cache.clear(); await fill(false); status(); watch(); side(); return t != null;
}
function step(k) {
  const tf = curCfg().tf, d = k === "D" ? 86400 : k === "-D" ? -86400 : +k * STEP[tf];
  return goTo((st.until != null ? st.until : st.newest) + d);
}
document.querySelectorAll("button[data-step]").forEach(b => b.onclick = () => step(b.dataset.step));
$("at").addEventListener("change", () => { const v = $("at").value; if (v) goTo(Date.parse(v + ":00Z") / 1000); });
$("at").addEventListener("keydown", e => e.stopPropagation());
const stopPlay = () => { if (timer) { clearInterval(timer); timer = null; $("play").textContent = "▶ Play"; } };
$("now").onclick = () => { stopPlay(); st.replay = false; goTo(null); };
$("replaybtn").onclick = () => { if (st.replay || st.until != null) return $("now").onclick(); st.replay = true; status(); };
$("play").onclick = () => { if (timer) return stopPlay();
  $("play").textContent = "❚❚ Pause"; timer = setInterval(async () => { if (!(await step("1"))) stopPlay(); }, 1000); };

document.addEventListener("keydown", e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (e.altKey) {                                         // the drawing shortcuts he knows
    if (k === "t") { e.preventDefault(); setPlace(KIND.trendline); }
    else if (k === "h") { e.preventDefault(); setPlace(KIND[st.lastKind.level || "BOS"]); }
    else if (k === "v") { e.preventDefault(); setPlace(KIND[st.lastKind.vline || "→ bull"]); }
    else if (k === "r") { e.preventDefault(); st.panes.forEach(p => !p.pct && p.times.length && recentre(p)); setTimeout(align, 120); }
    return;
  }
  if (e.ctrlKey || e.metaKey) return;
  if (e.shiftKey && k === "f") full(cur());
  else if (e.shiftKey && k === "n") { e.preventDefault(); st.side = true; st.tab = "notes"; save(); side(); $("notetext").focus(); }
  else if (e.shiftKey && k === "l") allLine();
  else if (e.shiftKey && k === "r") refresh();
  else if (e.shiftKey) return;
  else if (k === "l") $("ctype").click();
  else if (k === "g") setGrab(!st.grab);
  else if (k === "n") setNoteTool(!st.noteTool);
  else if (k === "m") toggleSnap();
  else if (k === "w") $("readbtn").click();
  else if (k === "escape") { setPlace(null); setGrab(false); setNoteTool(false); $("fly").style.display = "none"; $("menu").style.display = "none"; }
});

(async function start() {
  const a = await (await fetch("api/assets")).json(); st.assets = a.assets;
  loadMine();
  const q = new URLSearchParams(location.search), tf = TFS.includes(q.get("tf")) ? q.get("tf") : null;       // a link can set the charts: ?assets=US100,US500&tf=5m or ?asset=UK100&tf=1D
  const as = ((q.get("assets") || q.get("asset") || "")).split(",").filter(n => st.assets.includes(n));
  if (as.length) { st.cfg = as.map(asset => ({ asset, tf: tf || "1D" })); st.cols = 0; }
  const ok = (st.cfg || []).filter(c => st.assets.includes(c.asset) && TFS.includes(c.tf));
  st.cfg = ok.length ? ok : [{ asset: st.assets[0], tf: "1D" }];
  build(); side(); watch(); loadNotes(); pollMode();
})();
</script>
</body>
